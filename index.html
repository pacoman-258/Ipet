      function scheduleNotifyState() {
        if (notifyTimer) {
          return;
        }
        notifyTimer = setTimeout(() => {
          notifyTimer = null;
          notifyStateNow();
        }, 80);
      }

      function notifyStateNow() {
        if (!qtBridge || typeof qtBridge.petStateChanged !== "function") {
          return;
        }

        const payload = {
          scale: state.scale,
          offset_x: roundInt(state.offset_x),
          offset_y: roundInt(state.offset_y),
          rotation: state.rotation,
          opacity: state.opacity,
        };

        qtBridge.petStateChanged(JSON.stringify(payload));
      }

      function setMouthOpen(value) {
        if (!model || !model.internalModel || !model.internalModel.coreModel) {
          return;
        }
        const core = model.internalModel.coreModel;
        const v = clamp(Number(value) || 0, 0, 1);
        const openIds = Array.isArray(state.chat?.mouth_parameter_ids) && state.chat.mouth_parameter_ids.length
          ? state.chat.mouth_parameter_ids
          : DEFAULT_MOUTH_OPEN_PARAMETER_IDS;
        const formIds = Array.isArray(state.chat?.mouth_form_parameter_ids) && state.chat.mouth_form_parameter_ids.length
          ? state.chat.mouth_form_parameter_ids
          : DEFAULT_MOUTH_FORM_PARAMETER_IDS;
        for (const parameterId of openIds) {
          try {
            if (typeof core.setParameterValueById === "function") {
              core.setParameterValueById(parameterId, v, 0.8);
            } else if (typeof core.addParameterValueById === "function") {
              core.addParameterValueById(parameterId, v * 0.65, 0.8);
            }
          } catch (_) {
            // ignore missing mouth parameters
          }
        }
        for (const parameterId of formIds) {
          try {
            if (typeof core.setParameterValueById === "function") {
              core.setParameterValueById(parameterId, (v - 0.5) * 0.35, 0.35);
            } else if (typeof core.addParameterValueById === "function") {
              core.addParameterValueById(parameterId, (v - 0.5) * 0.15, 0.35);
            }
          } catch (_) {
            // ignore missing mouth form parameters
          }
        }
      }

      function resolveExpressionName(name) {
        const expr = String(name || "").trim();
        if (!expr) {
          return "";
        }
        const available = Array.isArray(state.chat?.available_expressions) ? state.chat.available_expressions : [];
        if (!available.length) {
          return expr;
        }
        if (available.includes(expr)) {
          return expr;
        }
        const normalized = expr.toLowerCase().replace(/[\s_-]+/g, "");
        const fallback = available.find((item) => String(item).toLowerCase().replace(/[\s_-]+/g, "") === normalized);
        return fallback || "";
      }

      function triggerExpressionSafe(name) {
        const expr = resolveExpressionName(name);
        if (!expr || !model || typeof model.expression !== "function") {
          return;
        }
        try {
          model.expression(expr);
        } catch (_) {
          // ignore missing/invalid expression
        }
      }

      function stopLipSyncLoop() {
        if (lipsyncRAF) {
          cancelAnimationFrame(lipsyncRAF);
          lipsyncRAF = 0;
        }
        setMouthOpen(0);
      }

      function startLipSync(audioEl) {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === "suspended") {
            audioCtx.resume().catch(() => {});
          }
          if (mediaSource) {
            try {
              mediaSource.disconnect();
            } catch (_) {}
            mediaSource = null;
          }
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          mediaSource = audioCtx.createMediaElementSource(audioEl);
          mediaSource.connect(analyser);
          analyser.connect(audioCtx.destination);
        } catch (_) {
          return;
        }

        const data = new Uint8Array(analyser.fftSize);
        const tick = () => {
          if (!analyser || audioEl.paused || audioEl.ended) {
            stopLipSyncLoop();
            return;
          }
          analyser.getByteTimeDomainData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) {
            const n = (data[i] - 128) / 128;
            sum += n * n;
          }
          const rms = Math.sqrt(sum / data.length);
          const lipSyncGain = Math.max(0.5, Number(state.chat?.lip_sync_gain || 1));
          const mouth = clamp(rms * (4.8 + lipSyncGain * 1.8), 0, 1);
          setMouthOpen(mouth);
          lipsyncRAF = requestAnimationFrame(tick);
        };
        tick();
      }

      function fallbackSpeakByBrowser(text) {
        const synth = window.speechSynthesis;
        if (!synth || !window.SpeechSynthesisUtterance) {
          return Promise.resolve();
        }
        return new Promise((resolve) => {
          try {
          synth.cancel();
          const utt = new SpeechSynthesisUtterance(text);
          utt.lang = "zh-CN";
          utt.rate = 1.0;
          utt.onstart = () => {
            let v = 0;
            const tick = () => {
              if (synth.speaking) {
                v = v > 0.4 ? 0.08 : 0.72;
                setMouthOpen(v);
                lipsyncRAF = requestAnimationFrame(tick);
              } else {
                stopLipSyncLoop();
              }
            };
            tick();
          };
          utt.onend = () => {
            stopLipSyncLoop();
            resolve();
          };
          utt.onerror = () => {
            stopLipSyncLoop();
            resolve();
          };
          synth.speak(utt);
          } catch (_) {
            stopLipSyncLoop();
            resolve();
          }
        });
      }

      function enqueueTTSChunk(text, expr = null) {
        const chunk = (text || "").trim();
        if (!chunk) {
          return;
        }
        ttsQueue.push({ text: chunk, expr: expr ? String(expr).trim() : null });
        if (!ttsPlaying) {
          playNextTTSChunk().catch(() => {});
        }
      }

      function feedSpeakBuffer(delta, force = false, expr = null) {
        pendingSpeakBuffer += delta || "";
        if (expr) {
          pendingSpeakExpr = String(expr).trim() || pendingSpeakExpr;
        }
        if (!force) {
          return;
        }
        const finalText = pendingSpeakBuffer.trim();
        const finalExpr = pendingSpeakExpr;
        pendingSpeakBuffer = "";
        pendingSpeakExpr = null;
        if (finalText) {
          enqueueTTSChunk(finalText, finalExpr);
        }
      }

      async function playNextTTSChunk() {
        if (ttsPlaying) {
          return;
        }
        const nextItem = ttsQueue.shift();
        if (!nextItem) {
          if (streamFinished) {
            setChatState("idle");
          }
          return;
        }
        const nextText = String(nextItem.text || "").trim();
        const nextExpr = String(nextItem.expr || "").trim();
        if (!nextText) {
          if (streamFinished && ttsQueue.length === 0) {
            setChatState("idle");
          }
          return;
        }

        const backend = (state.chat?.backend_url || "").replace(/\/$/, "");
        if (!backend) {
          if (streamFinished && ttsQueue.length === 0) {
            setChatState("idle");
          }
          return;
        }
        ttsPlaying = true;
        setChatState("tts");
        if (state.chat.expression_mode && nextExpr) {
          triggerExpressionSafe(nextExpr);
        }

        try {
          const resp = await fetch(`${backend}/api/tts`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: nextText,
              voice: state.chat.voice || "zh-CN-XiaoxiaoNeural",
              rate: toRateString(state.chat.rate_pct),
              volume: "+0%",
              provider: state.chat.tts_provider || "edge_tts",
              provider_url: state.chat.tts_provider_url || "",
            }),
          });
          if (!resp.ok) {
            let detail = `HTTP ${resp.status}`;
            try {
              const errData = await resp.json();
              detail = errData?.detail || detail;
            } catch (_) {}
            appendMessage("error", `TTS 失败：${detail}`);
            showError(`TTS 失败：${detail}`);
            ttsQueue = [];
            ttsPlaying = false;
            if (streamFinished) {
              setChatState("idle");
            }
            return;
          }

          const data = await resp.json();
          if (!data || !data.audio_url) {
            appendMessage("error", "TTS 失败：后端未返回 audio_url");
            showError("TTS 失败：后端未返回 audio_url");
            ttsQueue = [];
            ttsPlaying = false;
            if (streamFinished) {
              setChatState("idle");
            }
            return;
          }

          const audioResp = await fetch(`${backend}${data.audio_url}`);
          if (!audioResp.ok) {
            appendMessage("error", `音频下载失败: HTTP ${audioResp.status}`);
            showError(`音频下载失败: HTTP ${audioResp.status}`);
            ttsQueue = [];
            ttsPlaying = false;
            if (streamFinished) {
              setChatState("idle");
            }
            return;
          }

          const audioBlob = await audioResp.blob();
          const blobUrl = URL.createObjectURL(audioBlob);

          if (activeAudio) {
            try {
              activeAudio.pause();
            } catch (_) {}
          }
          activeAudio = new Audio(blobUrl);
          activeAudio.preload = "auto";

          await new Promise((resolve, reject) => {
            activeAudio.addEventListener(
              "ended",
              () => {
                stopLipSyncLoop();
                URL.revokeObjectURL(blobUrl);
                resolve();
              },
              { once: true },
            );
            activeAudio.addEventListener(
              "error",
              () => {
                stopLipSyncLoop();
                URL.revokeObjectURL(blobUrl);
                reject(new Error("音频播放失败"));
              },
              { once: true },
            );
            setChatState("speaking");
            activeAudio
              .play()
              .then(() => startLipSync(activeAudio))
              .catch(reject);
          });
        } catch (err) {
          appendMessage("error", `音频播放失败：${err?.message || err}`);
          showError(`音频播放失败：${err?.message || err}`);
          ttsQueue = [];
          stopLipSyncLoop();
        }

        ttsPlaying = false;
        await playNextTTSChunk();
      }

      function appendApprovalBubble(payload, sessionId = "") {
        const message = ensureAssistantWorklogTurn(sessionId);
        appendWorklogPhase(
          {
            phase: "action",

          approvalCardEl.appendChild(previewEl);
        }

        const actionWrap = document.createElement("div");
        actionWrap.className = "approval-actions";

        const approveBtn = document.createElement("button");

        actionWrap.appendChild(approveBtn);

        const setResolved = (text) => {

        approveBtn.addEventListener("click", async () => {
          if (!payload.turn_id || activeApprovalId) {

          activeApprovalId = String(payload.turn_id);
          appendMessage("user", "好，去做吧。", { speakerName: "你" });
          setResolved("已批准，正在处理。");
          await continueApproval(payload.turn_id, true);
        });

        rejectBtn.addEventListener("click", async () => {
          if (!payload.turn_id || activeApprovalId || pendingApprovalInputTurnId) {
            return;
          }
          activeApprovalId = String(payload.turn_id);
          pendingApprovalInputTurnId = String(payload.turn_id);
          setResolved("已拒绝这一步，请在输入框里告诉我接下来该怎么调整。");
          appendWorklogPhase(
            {
              phase: "action",
              text: "这一步我先暂停啦。你直接补充想法，我会沿着当前任务继续处理。",
              source: "human_ops",
              transient: false,
              status_id: `approval_rejected:${String(payload.turn_id || "").trim()}`,
              render: "worklog",
            },
            sessionId,
          );
          setChatState("awaiting_followup_input");
          chatInputEl.focus();
        });

        return message;
      }

      async function consumeChatStream(resp, options = {}) {
        if (!resp.ok) {
          let detail = `chat http ${resp.status}`;
          try {
            const payload = await resp.json();
            detail = String(payload?.detail || payload?.message || detail);
          } catch (_) {
            try {
              const text = await resp.text();
              if (text) {
                detail = text;
              }
            } catch (_) {}
          }
          throw new Error(detail);
        }
        if (!resp.body) {
          throw new Error("聊天响应缺少内容");
        }

        const decoder = new TextDecoder();
        const reader = resp.body.getReader();
        let buffer = "";
        let assistantTurn = null;
        let full = "";
        let awaitingApproval = false;
        let receivedDisplaySegment = false;
        const thoughtSessionId = beginThoughtSession(String(options?.thoughtSessionId || "").trim());
        currentThoughtGroup = ensureThoughtGroup(1, true, thoughtSessionId);
        assistantTurn = ensureAssistantWorklogTurn(thoughtSessionId);
        receivedStructuredSegment = false;

        const ensureFinalMessage = () => {
          assistantTurn = ensureAssistantWorklogTurn(thoughtSessionId);
          return assistantTurn;
        };

        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            break;
          }
          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";

          for (const raw of chunks) {
            const lines = raw.split("\n");
            let eventName = "";
            let dataText = "";
            for (const line of lines) {
              if (line.startsWith("event:")) {
                eventName = line.slice(6).trim();
              } else if (line.startsWith("data:")) {
                dataText += line.slice(5).trim();
              }
            }
            if (!eventName || !dataText) {
              continue;
            }
            const payload = JSON.parse(dataText);
            if (eventName === "meta") {
              if (payload.pet_display_name) {
                state.chat.pet_display_name = String(payload.pet_display_name);
                syncPetDisplayName();
              }
              if (payload.chat_mode) {
                currentChatMode = normalizeChatMode(payload.chat_mode);
                applyChatModeUI();
              }
              if (payload.memory_mode) {
                currentMemoryMode = normalizeMemoryMode(payload.memory_mode);
                applyMemoryModeUI();
              }
              if (payload.topic_id && currentMemoryMode !== "temporary") {
                currentTopicId = String(payload.topic_id || "").trim() || currentTopicId;
                state.chat.session_id = currentTopicId;
                currentTopicMeta = topicHistoryItems.find((item) => item.topic_id === currentTopicId) || currentTopicMeta;
                syncTopicIndicator();
              }
              renderTopicHistoryList();
              updateShellButtons();
            } else if (eventName === "phase") {
              removeEmptyPendingThoughtGroup(thoughtSessionId);
              appendWorklogPhase(payload, thoughtSessionId);
            } else if (eventName === "approval_required") {
              awaitingApproval = true;
              removeEmptyPendingThoughtGroup(thoughtSessionId);
              appendApprovalBubble(payload, thoughtSessionId);
            } else if (eventName === "segment") {
              removeEmptyPendingThoughtGroup(thoughtSessionId);
              receivedStructuredSegment = true;
              const segText = String(payload.text || "");
              const segExpr = payload.expr == null ? null : String(payload.expr || "");
              if (segText) {
                feedSpeakBuffer(segText, false, segExpr);
              }
            } else if (eventName === "display_segment") {
              removeEmptyPendingThoughtGroup(thoughtSessionId);
              receivedDisplaySegment = true;
              full += String(payload.text || "");
              updateWorklogFinalText(ensureAssistantWorklogTurn(thoughtSessionId), full || "少女思考中...");
            } else if (eventName === "token") {
              if (receivedStructuredSegment) {
                continue;
              }
              removeEmptyPendingThoughtGroup(thoughtSessionId);
              full += payload.delta || "";
              updateWorklogFinalText(ensureAssistantWorklogTurn(thoughtSessionId), full || "少女思考中...");
              feedSpeakBuffer(payload.delta || "");
            } else if (eventName === "done") {
              full = payload.text || full;
              if (payload.memory_mode) {
                currentMemoryMode = normalizeMemoryMode(payload.memory_mode);
                applyMemoryModeUI();
              }
              if (payload.topic_id && currentMemoryMode !== "temporary") {
                currentTopicId = String(payload.topic_id || "").trim() || currentTopicId;
                state.chat.session_id = currentTopicId;
              }
              removeEmptyPendingThoughtGroup(thoughtSessionId);
              if (receivedStructuredSegment && !receivedDisplaySegment && !full) {
                full = "(\u8bed\u97f3\u8f93\u51fa\u5df2\u5b8c\u6210)";
              }
              if (!receivedStructuredSegment && !pendingSpeakBuffer.trim() && full.trim()) {
                pendingSpeakBuffer = full;
              }
              updateWorklogFinalText(ensureFinalMessage(), full || "(\u7a7a\u54cd\u5e94)");
              if (currentMemoryMode !== "temporary" && topicHistoryEnabled()) {
                await loadTopicHistory(true);
              } else {
                renderTopicHistoryList();
              }
              clearActiveThoughtSession(thoughtSessionId);
            } else if (eventName === "error") {
              clearActiveThoughtSession(thoughtSessionId);
              throw new Error(payload.message || "聊天流返回错误");
            }
          }
        }

        if (!awaitingApproval) {
          removeEmptyPendingThoughtGroup(thoughtSessionId);
        }
        return { full, awaitingApproval, thoughtSessionId };
      }

      async function continueApproval(turnId, approved, userText = "") {
        const backend = (state.chat?.backend_url || "").replace(/\/$/, "");
        if (!backend) {
          appendMessage("error", "后端地址未配置");
          return;
        }
        stopSpeaking(false);
        setChatState("streaming");
        streamFinished = false;
        receivedStructuredSegment = false;
        pendingSpeakBuffer = "";
        pendingSpeakExpr = null;
        ttsQueue = [];
        ttsPlaying = false;
        const turnKey = String(turnId || "").trim();
        const thoughtSessionId = String(approvalThoughtSessionRefs.get(turnKey) || activeThoughtSessionId || createThoughtSessionId()).trim();
        try {
          const resp = await fetch(`${backend}/api/human-ops/proposals/${encodeURIComponent(turnId)}/decision`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ approved: !!approved, user_text: String(userText || "") }),
          });
          removeApprovalBubble(turnId);
          const result = await consumeChatStream(resp, { thoughtSessionId });
          if (result.awaitingApproval) {
            setChatState("awaiting_approval");
            approvalThoughtSessionRefs.set(turnKey, thoughtSessionId);
            return;
          }
          approvalThoughtSessionRefs.delete(turnKey);
          if (!result.awaitingApproval) {
            streamFinished = true;
            feedSpeakBuffer("", true);
            if (!ttsPlaying && ttsQueue.length === 0) {
              setChatState("idle");
            }
          }
        } catch (err) {
          approvalThoughtSessionRefs.delete(turnKey);
          clearActiveThoughtSession(thoughtSessionId);
          appendMessage("error", `对话失败：${err?.message || String(err)}`, {
            speakerName: "系统",
          });
          setChatState("idle");
        } finally {
          activeApprovalId = "";
          pendingApprovalInputTurnId = "";
          if (chatState !== "awaiting_approval" && chatState !== "idle" && !ttsPlaying) {
            setChatState("idle");
          }
        }
      }

      async function streamChat(text) {
        const backend = (state.chat?.backend_url || "").replace(/\/$/, "");
        if (!backend) {
          appendMessage("error", "后端地址未配置", { speakerName: "系统" });
          return;
        }
        const userText = text.trim();
        if (!userText) {
          return;
        }
        if (pendingApprovalInputTurnId) {
          appendMessage("user", userText, { speakerName: "你" });
          activeApprovalId = String(pendingApprovalInputTurnId);
          await continueApproval(pendingApprovalInputTurnId, false, userText);
          return;
        }
        if (currentMemoryMode !== "temporary") {
          await ensureTopicReady();
        }
        if (currentChatMode === "skill") {
          await loadChatSkills(false);
          if (!activeChatSkillIds().length) {
            appendMessage("error", "技能模式至少需要启用一个技能。请先打开“技能”面板，或去设置页启用默认技能。", {
              speakerName: "系统",
            });
            toggleChatSkillsDrawer(true);
            return;
          }
        }
        const retryEdit = pendingRetryEdit;
        let retryFromAssistantTurn = null;
        if (retryEdit?.messageId) {
          const truncated = truncateChatAfterMessage(retryEdit.messageId);
          retryFromAssistantTurn = Number(truncated?.assistantTurn || retryEdit.assistantTurn || 0) || null;
          clearPendingRetryEdit();
        }
        appendMessage("user", userText, { speakerName: "你", assistantTurn: retryFromAssistantTurn });
        stopSpeaking(false);
        setChatState("streaming");
        streamFinished = false;
        receivedStructuredSegment = false;
        pendingSpeakBuffer = "";
        pendingSpeakExpr = null;
        ttsQueue = [];
        ttsPlaying = false;
        activeApprovalId = "";
        const thoughtSessionId = beginThoughtSession();

        try {
          const resp = await fetch(`${backend}/api/chat/stream`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session_id: state.chat.session_id || "default",
              model: state.chat.model || "gpt-5.4",
              system_prompt: state.chat.system_prompt || "",
              expression_mode: !!state.chat.expression_mode,
              expression_output_format: state.chat.expression_output_format || "ndjson_v1",
              available_expressions: Array.isArray(state.chat.available_expressions)
                ? state.chat.available_expressions
                : [],
              react_enabled: state.chat.react_enabled !== false,
              react_visibility: state.chat.react_visibility || "inline",
              max_reasoning_steps: Number(state.chat.max_reasoning_steps || 10),
              chat_mode: currentChatMode,
              memory_mode: currentMemoryMode,
              skill_ids: currentChatMode === "chat" ? [] : activeChatSkillIds(),
              retry_from_assistant_turn: retryFromAssistantTurn,
              text: userText,
            }),
          });

          const result = await consumeChatStream(resp, { thoughtSessionId });
          if (result.awaitingApproval) {
            setChatState("awaiting_approval");
            return;
          }
        } catch (err) {
          clearActiveThoughtSession(thoughtSessionId);
          appendMessage("error", `对话失败：${err?.message || String(err)}`, {
            speakerName: "系统",
          });
          setChatState("idle");
          return;
        }

        streamFinished = true;
        feedSpeakBuffer("", true);
        if (!ttsPlaying && ttsQueue.length === 0) {
          setChatState("idle");
        }
      }

      async function submitChatInput() {
        if (!canSubmitChatInput() || asrStarting || asrRecording || asrAwaitingFinal) {
          return;
        }
        const text = chatInputEl.value;
        if (!String(text || "").trim()) {
          chatInputEl.focus();
          return;
        }
        chatInputEl.value = "";
        await streamChat(text);
      }

      function applyModelTransform() {
        if (!app || !model) {
          refreshStatus();
          return;
        }

        state.scale = clamp(Number(state.scale) || 0.3, MIN_SCALE, MAX_SCALE);
        state.opacity = clamp(Number(state.opacity) || 1, 0.1, 1);
        state.rotation = Number(state.rotation) || 0;

        model.scale.set(state.scale);
        model.alpha = state.opacity;
        model.rotation = (state.rotation * Math.PI) / 180;

        // Keep the model inside the window by default: bottom-center layout.
        const scaledWidth = model.width;
        const scaledHeight = model.height;
        const baseX = (app.renderer.width - scaledWidth) * 0.5;
        const baseY = app.renderer.height - scaledHeight;

        model.x = baseX + (Number(state.offset_x) || 0);
        model.y = baseY + (Number(state.offset_y) || 0);

        refreshStatus();
      }

      function bindModelInteraction() {
        if (!app || !model) {
          return;
        }

        model.interactive = true;
        if ("eventMode" in model) {
          model.eventMode = "static";
        }
        model.cursor = "pointer";

        model.on("pointerdown", (event) => {
          if (!state.edit_mode) {
            return;
          }
          dragging = true;
          const p = event?.data?.global;
          if (p) {
            dragDx = model.x - p.x;
            dragDy = model.y - p.y;
          }
        });

        model.on("pointertap", () => {
          playMotionCompat("Tap", 0);
        });

        model.on("hit", (hitAreas) => {
          if (!Array.isArray(hitAreas) || hitAreas.length === 0) {
            return;
          }
          const hasBody = hitAreas.some((v) => String(v).toLowerCase().includes("body"));
          const group = hasBody ? "Tap@Body" : "Tap";
          playMotionCompat(group, 0);
        });
      }

      function setupStageInteraction() {
        if (!app) {
          return;
        }

        app.stage.interactive = true;
        if ("eventMode" in app.stage) {
          app.stage.eventMode = "static";
        }
        app.stage.hitArea = app.screen;

        app.stage.on("pointerup", () => {
          if (dragging) {
            dragging = false;
            notifyStateNow();
          }
        });

        app.stage.on("pointerupoutside", () => {
          if (dragging) {
            dragging = false;
            notifyStateNow();
          }
        });

        app.stage.on("pointermove", (event) => {
          if (!dragging || !state.edit_mode || !model) {
            return;
          }

          const p = event?.data?.global;
          if (!p) {
            return;
          }

          model.x = p.x + dragDx;
          model.y = p.y + dragDy;

          const scaledWidth = model.width;
          const scaledHeight = model.height;
          const baseX = (app.renderer.width - scaledWidth) * 0.5;
          const baseY = app.renderer.height - scaledHeight;
          state.offset_x = roundInt(model.x - baseX);
          state.offset_y = roundInt(model.y - baseY);

          refreshStatus();
          scheduleNotifyState();
        });

        window.addEventListener(
          "wheel",
          (event) => {
            if (!state.edit_mode || !model) {
              return;
            }

            event.preventDefault();
            const zoomIn = event.deltaY < 0;
            const factor = zoomIn ? 1.05 : 0.95;
            state.scale = clamp(state.scale * factor, MIN_SCALE, MAX_SCALE);
            applyModelTransform();
            scheduleNotifyState();
          },
          { passive: false }
        );
      }

      function isRendererReady() {
        return !!(app && app.renderer && app.stage);
      }

      function playMotionCompat(group, index = 0) {
        if (!model) {
          return false;
        }

        if (typeof model.motion === "function") {
          try {
            model.motion(group, index);
            return true;
          } catch (_) {
            // fall through to internal manager
          }
        }

        const manager = model.internalModel?.motionManager;
        if (manager && typeof manager.startMotion === "function") {
          try {
            manager.startMotion(group, index);
            return true;
          } catch (_) {
            // ignore manager errors
          }
        }

        return false;
      }

      async function loadModel(url) {
        if (!url) {
          return;
        }

        if (!window.PIXI || !window.PIXI.live2d || !window.PIXI.live2d.Live2DModel) {
          throw new Error("PIXI Live2D 模型组件不可用，请检查 JS 资源文件。");
        }

        clearError();

        if (!isRendererReady()) {
          pendingModelUrl = url;
          return;
        }

        if (model) {
          try {
            model.removeAllListeners();
            app.stage.removeChild(model);
            model.destroy();
          } catch (_) {
            // ignore cleanup errors
          }
          model = null;
        }

        model = await window.PIXI.live2d.Live2DModel.from(url);
        app.stage.addChild(model);

        bindModelInteraction();

        if (!Number.isFinite(state.scale) || state.scale <= 0) {
          const fitScaleX = (app.renderer.width * 0.65) / Math.max(1, model.width);
          const fitScaleY = (app.renderer.height * 0.92) / Math.max(1, model.height);
          state.scale = clamp(Math.min(fitScaleX, fitScaleY), MIN_SCALE, MAX_SCALE);
        }
        // Avoid invisible placement caused by oversized historic config values.
        if (model.width > app.renderer.width * 2 || model.height > app.renderer.height * 2) {
          const fitScaleX = (app.renderer.width * 0.65) / Math.max(1, model.width);
          const fitScaleY = (app.renderer.height * 0.92) / Math.max(1, model.height);
          state.scale = clamp(state.scale * Math.min(fitScaleX, fitScaleY), MIN_SCALE, MAX_SCALE);
        }

        applyModelTransform();
        notifyStateNow();
      }

      async function applyConfig(config) {
        const incoming = config || {};

        if (incoming.pet && typeof incoming.pet === "object") {
          Object.assign(state, incoming.pet);
        } else {
          Object.assign(state, incoming);
        }
        if (incoming.chat && typeof incoming.chat === "object") {
          Object.assign(state.chat, incoming.chat);
          state.chat.asr = normalizeAsrConfig(state.chat?.asr || {});
          const configuredDefaults = Array.isArray(incoming.chat.skills?.default_active_ids)
            ? incoming.chat.skills.default_active_ids
            : [];
          chatSkillDefaultIds = dedupeSkillIds(configuredDefaults);
          if (!chatSelectedSkillIds.length) {
            chatSelectedSkillIds = chatSkillDefaultIds.slice();
          }
          chatSkillsLoaded = false;
          currentTopicId = String(state.chat.session_id || currentTopicId || "default").trim() || "default";
          currentTopicMeta = topicHistoryItems.find((item) => item.topic_id === currentTopicId) || currentTopicMeta;
          if (!topicHistoryEnabled()) {
            chatHistoryDrawerEl.classList.remove("open");
          }
          renderTopicHistoryList();
          applyChatModeUI();
          applyMemoryModeUI();
          updateShellButtons();
          if (!state.chat.asr.enabled && (asrStarting || asrRecording || asrAwaitingFinal)) {
            cancelAsrSession({ restoreInput: true, statusMessage: defaultAsrStatusText(), tone: "idle" });
          } else {
            setAsrStatus(defaultAsrStatusText(), "idle");
            syncChatInputAvailability();
          }
        }
        syncPetDisplayName();
        state.chat.asr = normalizeAsrConfig(state.chat?.asr || {});
        setAsrStatus(defaultAsrStatusText(), "idle");
        syncChatInputAvailability();
        state.background_enabled = !!state.background_enabled;
        state.background_image = String(state.background_image || "");
        state.background_image_url = String(state.background_image_url || "");
        state.background_overlay_opacity = backgroundOverlayValue(state.background_overlay_opacity);
        applyBackgroundVisuals();

        const nextModelUrl = incoming.model_url || incoming.modelUrl || state.model_url;
        if (typeof nextModelUrl === "string" && nextModelUrl.length > 0) {
          const changed = nextModelUrl !== state.model_url;
          state.model_url = nextModelUrl;
          if (changed || !model) {
            try {
              await loadModel(state.model_url);
            } catch (err) {
              showError(`加载模型失败：${err?.message || String(err)}`);
            }
          } else {
            applyModelTransform();
          }
        } else {
          applyModelTransform();
        }

        refreshStatus();
      }

      async function init() {
        if (!window.PIXI) {
          showError("PIXI 加载失败。");
          return;
        }

        app = new window.PIXI.Application({
          view: canvas,
          resizeTo: window,
          autoStart: true,
          backgroundAlpha: 0,
          antialias: true,
        });
        applyBackgroundVisuals();

        setupStageInteraction();

        app.ticker.add(() => {
          if (!model || !state.follow_mouse) {
            return;
          }

          const interaction = app.renderer?.plugins?.interaction;
          const mouse = interaction?.mouse?.global;
          if (!mouse || typeof model.focus !== "function") {
            return;
          }
          model.focus(mouse.x, mouse.y);
        });

        if (window.qt && window.QWebChannel) {
          new window.QWebChannel(window.qt.webChannelTransport, (channel) => {
            qtBridge = channel.objects.qtBridge;
            logToQt("QWebChannel ready");
          });
        }

        navSettingsButtonEl.addEventListener("click", () => {
          openSettingsPage();
        });
        navHistoryButtonEl.addEventListener("click", () => {
          openChat();
          toggleChatHistoryDrawer();
        });
        navChatButtonEl.addEventListener("click", async () => {
          if (currentMemoryMode === "temporary") {
            clearPendingDeleteTopic(false);
            replaceChatMessages([]);
            toggleChatSkillsDrawer(false);
            toggleChatHistoryDrawer(false);
            openChat();
            renderTopicHistoryList();
            updateShellButtons();
            return;
          }
          await createNewTopic(true);
        });
        windowMinimizeEl.addEventListener("click", () => {
          callQtBridge("minimizeWindow");
        });
        windowCloseEl.addEventListener("click", () => {
          callQtBridge("closeWindow");
        });
        for (const button of chatModeButtons) {
          button.addEventListener("click", () => setChatMode(button.dataset.chatMode));
        }
        for (const button of memoryModeButtons) {
          button.addEventListener("click", () => setMemoryMode(button.dataset.memoryMode));
        }
        chatCloseEl.addEventListener("click", () => closeChat());
        chatSkillsToggleEl.addEventListener("click", () => toggleChatSkillsDrawer());
        chatHistoryRefreshEl.addEventListener("click", () => loadTopicHistory(true));
        chatSkillsRefreshEl.addEventListener("click", () => loadChatSkills(true));
        chatSkillsResetEl.addEventListener("click", () => resetChatSkillsToDefault());
        updateShellButtons();
        chatSendEl.addEventListener("click", async () => {
          await submitChatInput();
        });
        chatInputEl.addEventListener("keydown", async (event) => {
          if (matchesPushToTalkKey(event) && shouldHandlePushToTalk(event)) {
            event.preventDefault();
            return;
          }
          if (event.key === "Escape" && pendingRetryEdit) {
            event.preventDefault();
            clearPendingRetryEdit();
            return;
          }
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            await submitChatInput();
          }
        });
        chatStopEl.addEventListener("click", () => {
          if (asrStarting || asrRecording || asrAwaitingFinal) {
            cancelAsrSession({ restoreInput: true, statusMessage: defaultAsrStatusText(), tone: "idle" });
            return;
          }
          stopSpeaking(true);
        });
        window.addEventListener("keydown", async (event) => {
          if (!matchesPushToTalkKey(event) || !shouldHandlePushToTalk(event)) {
            return;
          }
          if (event.repeat) {
            event.preventDefault();
            return;
          }
          event.preventDefault();
          await startPushToTalk();
        });
        window.addEventListener("keyup", (event) => {
          if (!matchesPushToTalkKey(event)) {
            return;
          }
          event.preventDefault();
          stopPushToTalk();
        });
        window.addEventListener("blur", () => {
          if (asrStarting || asrRecording || asrAwaitingFinal) {
            cancelAsrSession({ restoreInput: true, statusMessage: defaultAsrStatusText(), tone: "idle" });
          }
        });

        chatHeaderEl.addEventListener("pointerdown", (event) => {
          if (event.target === chatCloseEl) {
            return;
          }
          chatDragging = true;
          dragStartX = event.clientX;
          dragStartY = event.clientY;
          panelStartLeft = chatPanelEl.offsetLeft;
          panelStartTop = chatPanelEl.offsetTop;
          chatHeaderEl.setPointerCapture(event.pointerId);
          event.preventDefault();
        });

        const beginResize = (event, mode) => {
          chatResizing = true;
          chatResizeMode = mode;
          dragStartX = event.clientX;
          dragStartY = event.clientY;
          panelStartW = chatPanelEl.offsetWidth;
          panelStartH = chatPanelEl.offsetHeight;
          panelStartLeft = chatPanelEl.offsetLeft;
          panelStartTop = chatPanelEl.offsetTop;
          event.target.setPointerCapture(event.pointerId);
          event.preventDefault();
        };

        chatResizerRightEl.addEventListener("pointerdown", (event) => beginResize(event, "right"));
        chatResizerBottomEl.addEventListener("pointerdown", (event) => beginResize(event, "bottom"));
        chatResizerCornerEl.addEventListener("pointerdown", (event) => beginResize(event, "corner"));

        window.addEventListener("pointermove", (event) => {
          if (chatDragging) {
            const dx = event.clientX - dragStartX;
            const dy = event.clientY - dragStartY;
            const left = Math.min(
              Math.max(panelStartLeft + dx, 0),
              Math.max(0, window.innerWidth - chatPanelEl.offsetWidth),
            );
            const top = Math.min(
              Math.max(panelStartTop + dy, 0),
              Math.max(0, window.innerHeight - chatPanelEl.offsetHeight),
            );
            chatPanelEl.style.left = `${left}px`;
            chatPanelEl.style.top = `${top}px`;
          } else if (chatResizing) {
            const dx = event.clientX - dragStartX;
            const dy = event.clientY - dragStartY;
            const baseLeft = panelStartLeft;
            const baseTop = panelStartTop;
            let w = panelStartW;
            let h = panelStartH;
            if (chatResizeMode === "right" || chatResizeMode === "corner") {
              w = Math.min(Math.max(panelStartW + dx, 300), Math.max(300, window.innerWidth - baseLeft));
            }
            if (chatResizeMode === "bottom" || chatResizeMode === "corner") {
              h = Math.min(Math.max(panelStartH + dy, 280), Math.max(280, window.innerHeight - baseTop));
            }
            chatPanelEl.style.width = `${w}px`;
            chatPanelEl.style.height = `${h}px`;
          }
        });

        window.addEventListener("pointerup", () => {
          if (chatDragging || chatResizing) {
            saveChatPanelState();
          }
          chatDragging = false;
          chatResizing = false;
          chatResizeMode = "";
        });

        if (pendingConfig) {
          const cfg = pendingConfig;
          pendingConfig = null;
          await applyConfig(cfg);
        } else if (pendingModelUrl) {
          const url = pendingModelUrl;
          pendingModelUrl = "";
          await loadModel(url);
        }

        syncPetDisplayName();
        applyChatModeUI();
        applyMemoryModeUI();
        refreshStatus();
      }

      window.PET_APP = {
        async applyConfig(config) {
          if (!isRendererReady()) {
            pendingConfig = config || {};
            return;
          }
          await applyConfig(config);
        },
        async reloadModel() {
          if (state.model_url) {
            try {
              await loadModel(state.model_url);
            } catch (err) {
              showError(`重新加载模型失败：${err?.message || String(err)}`);
            }
          }
        },
        playMotion(group, index = 0) {
          if (!playMotionCompat(group, index)) {
            showError(`动作播放失败：无法播放 ${String(group)}[${Number(index) || 0}]`);
          }
        },
        playExpression(name) {
          if (!model || typeof model.expression !== "function") {
            return;
          }
          try {
            model.expression(name);
          } catch (err) {
            showError(`表情切换失败：${String(err)}`);
          }
        },
        getState() {
          return { ...state };
        },
        openChat,
        closeChat,
        async sendChat(text) {
          await streamChat(text || "");
        },
        async speakText(text) {
          const content = (text || "").trim();
          if (!content) return;
          stopSpeaking(false);
          streamFinished = true;
          pendingSpeakBuffer = "";
          pendingSpeakExpr = null;
          ttsQueue = [];
          ttsPlaying = false;
          enqueueTTSChunk(content, null);
        },
        stopSpeak() {
          stopSpeaking(true);
        },
      };

      init().catch((err) => {
        showError(err?.message || String(err));
      });
    })();
  </script>
</body>
