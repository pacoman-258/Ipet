  <script>
    (() => {
      const MIN_SCALE = 0.05;
      const MAX_SCALE = 5.0;

      const state = {
        model_url: "",
        scale: 0.3,
        offset_x: 0,
        offset_y: 40,
        rotation: 0,
        opacity: 1,
        edit_mode: false,
        follow_mouse: true,
        background_enabled: false,
        background_image: "",
        background_image_url: "",
        background_overlay_opacity: 0.42,
        chat: {
          backend_url: "http://127.0.0.1:8008",
          model: "gpt-5.4",
          session_id: "default",
          voice: "zh-CN-XiaoxiaoNeural",
          rate_pct: 0,
          tts_provider: "edge_tts",
          tts_provider_url: "",
          expression_mode: true,
          expression_output_format: "ndjson_v1",
          react_enabled: true,
          react_visibility: "inline",
          max_reasoning_steps: 10,
          available_expressions: [],
          lip_sync_gain: 1,
          mouth_parameter_ids: [],
          mouth_form_parameter_ids: [],
          skills: {
            enabled: true,
            default_active_ids: [],
          },
          asr: {
            enabled: true,
            provider: "funasr",
            api_base_url: "http://127.0.0.1:8012",
            push_to_talk_key: "Alt",
            interim_results: true,
          },
          system_prompt: "",
          pet_display_name: "机魂",
        },
      };
      const DEFAULT_MOUTH_OPEN_PARAMETER_IDS = ["ParamMouthOpenY", "PARAM_MOUTH_OPEN_Y", "ParamMouthOpenX", "LipSync"];
      const DEFAULT_MOUTH_FORM_PARAMETER_IDS = ["ParamMouthForm", "PARAM_MOUTH_FORM"];

      const backgroundLayerEl = document.getElementById("window-background");
      const backgroundImageEl = document.getElementById("window-background-image");
      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");
      const canvas = document.getElementById("canvas");
      const navSettingsButtonEl = document.getElementById("nav-settings");
      const navHistoryButtonEl = document.getElementById("nav-history");
      const navChatButtonEl = document.getElementById("nav-chat");
      const windowMinimizeEl = document.getElementById("window-minimize");
      const windowCloseEl = document.getElementById("window-close");
      const chatPanelEl = document.getElementById("chat-panel");
      const chatCloseEl = document.getElementById("chat-close");
      const chatHistoryDrawerEl = document.getElementById("chat-history-drawer");
      const chatHistoryCurrentEl = document.getElementById("chat-history-current");
      const chatHistoryRefreshEl = document.getElementById("chat-history-refresh");
      const chatHistoryStatusEl = document.getElementById("chat-history-status");
      const chatHistoryListEl = document.getElementById("chat-history-list");
      const chatSkillsToggleEl = document.getElementById("chat-skills-toggle");
      const chatModeButtons = Array.from(document.querySelectorAll(".chat-mode-btn[data-chat-mode]"));
      const memoryModeButtons = Array.from(document.querySelectorAll(".chat-mode-btn[data-memory-mode]"));
      const chatSkillsDrawerEl = document.getElementById("chat-skills-drawer");
      const chatSkillsRefreshEl = document.getElementById("chat-skills-refresh");
      const chatSkillsResetEl = document.getElementById("chat-skills-reset");
      const chatSkillsStatusEl = document.getElementById("chat-skills-status");
      const chatSkillsListEl = document.getElementById("chat-skills-list");
      const chatMessagesEl = document.getElementById("chat-messages");
      const chatInputEl = document.getElementById("chat-input");
      const chatInputWrapEl = document.getElementById("chat-input-wrap");
      const chatAsrStatusEl = document.getElementById("chat-asr-status");
      const chatSendEl = document.getElementById("chat-send");
      const chatStopEl = document.getElementById("chat-stop");
      const chatHeaderEl = document.getElementById("chat-header");
      const chatTitleEl = document.getElementById("chat-title");
      const chatResizerRightEl = document.getElementById("chat-resizer-right");
      const chatResizerBottomEl = document.getElementById("chat-resizer-bottom");
      const chatResizerCornerEl = document.getElementById("chat-resizer-corner");

      let app = null;
      let model = null;
      let qtBridge = null;
      let pendingConfig = null;
      let pendingModelUrl = "";
      let chatState = "idle";
      let activeAudio = null;
      let audioCtx = null;
      let analyser = null;
      let mediaSource = null;
      let lipsyncRAF = 0;
      let ttsQueue = [];
      let ttsPlaying = false;
      let streamFinished = false;
      let pendingSpeakBuffer = "";
      let pendingSpeakExpr = null;
      let speakFlushTimer = 0;
      let receivedStructuredSegment = false;
      let chatPanelPositioned = false;
      let chatDragging = false;
      let chatResizing = false;
      let chatResizeMode = "";
      let dragStartX = 0;
      let dragStartY = 0;
      let panelStartLeft = 0;
      let panelStartTop = 0;
      let panelStartW = 0;
      let panelStartH = 0;
      let activeApprovalId = "";
      let pendingApprovalInputTurnId = "";
      let humanOpsClickPreviewEl = null;
      let currentThoughtGroup = null;
      let currentAssistantWorklog = null;
      let assistantWorklogCounter = 0;
      let activeThoughtSessionId = "";
      let thoughtSessionCounter = 0;
      const approvalBubbleRefs = new Map();
      const approvalThoughtSessionRefs = new Map();
      let chatSkillCatalog = [];
      let chatSkillDefaultIds = [];
      let chatSelectedSkillIds = [];
      let chatSkillsLoaded = false;
      let topicHistoryItems = [];
      let topicHistoryLoaded = false;
      let topicHistoryLoading = false;
      let pendingDeleteTopicId = "";
      let pendingDeleteTopicTimer = null;
      let currentTopicId = String(state.chat.session_id || "default").trim() || "default";
      let currentTopicMeta = null;
      let currentChatMode = "react";
      let currentMemoryMode = "persistent";
      let pendingRetryEdit = null;
      let chatMessageSequence = 0;
      let asrAudioContext = null;
      let asrMediaStream = null;
      let asrInputSource = null;
      let asrProcessor = null;
      let asrSilenceGain = null;
      let asrSocket = null;
      let asrStarting = false;
      let asrRecording = false;
      let asrAwaitingFinal = false;
      let asrHotkeyPressed = false;
      let asrRunToken = 0;
      let asrDraftState = null;
      let activeAsrBaseUrl = "";
      let asrStatusTimer = 0;

      let dragging = false;
      let dragDx = 0;
      let dragDy = 0;
      let notifyTimer = null;

      backgroundImageEl.addEventListener("load", () => {
        backgroundLayerEl.classList.add("has-image");
        backgroundImageEl.style.display = "block";
      });

      backgroundImageEl.addEventListener("error", () => {
        backgroundLayerEl.classList.remove("has-image");
        backgroundImageEl.style.display = "none";
        backgroundImageEl.removeAttribute("src");
        if (state.background_enabled && state.background_image) {
          logToQt(`background image unavailable: ${state.background_image}`);
        }
      });

      function showError(msg) {
        errorEl.textContent = String(msg || "未知错误");
        errorEl.style.display = "block";
      }

      function clearError() {
        errorEl.style.display = "none";
        errorEl.textContent = "";
      }

      function logToQt(msg) {
        if (qtBridge && typeof qtBridge.log === "function") {
          qtBridge.log(String(msg));
        } else {
          console.log(msg);
        }
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function toRateString(ratePct) {
        let n = Number(ratePct);
        if (!Number.isFinite(n)) {
          n = 0;
        }
        n = Math.round(clamp(n, -50, 100));
        return `${n >= 0 ? "+" : ""}${n}%`;
      }

      function roundInt(value) {
        return Math.round(Number(value) || 0);
      }

      function backgroundOverlayValue(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) {
          return 0.42;
        }
        return clamp(n, 0, 0.9);
      }

      function applyBackgroundVisuals() {
        const enabled = !!state.background_enabled;
        const imageUrl = String(state.background_image_url || "").trim();
        const overlay = backgroundOverlayValue(state.background_overlay_opacity);
        document.documentElement.style.setProperty("--backdrop-overlay", String(overlay));
        document.documentElement.style.setProperty("--shell-overlay", String(overlay));
        if (!enabled || !imageUrl) {
          backgroundLayerEl.classList.remove("has-image");
          backgroundImageEl.removeAttribute("src");
          backgroundImageEl.style.display = "none";
          return;
        }
        backgroundImageEl.src = imageUrl;
      }

      function refreshStatus() {
        statusEl.style.display = state.edit_mode ? "block" : "none";
        const modelName = state.model_url ? state.model_url.split("/").pop() : "(none)";
        statusEl.textContent = [
          `model: ${modelName}`,
          `edit: ${state.edit_mode ? "on" : "off"}`,
          `scale: ${state.scale.toFixed(2)}`,
          `offset: (${roundInt(state.offset_x)}, ${roundInt(state.offset_y)})`,
          `bg: ${state.background_enabled && state.background_image_url ? "image" : "default"}`,
        ].join("\n");
      }

      function updateShellButtons() {
        const chatOpen = chatPanelEl.classList.contains("open");
        const historyOpen = chatOpen && chatHistoryDrawerEl.classList.contains("open");
        navChatButtonEl.classList.toggle("is-active", chatOpen && !historyOpen);
        navChatButtonEl.setAttribute("aria-pressed", String(chatOpen && !historyOpen));
        if (navHistoryButtonEl) {
          const enabled = topicHistoryEnabled();
          navHistoryButtonEl.disabled = !enabled;
          navHistoryButtonEl.classList.toggle("is-active", historyOpen);
          navHistoryButtonEl.setAttribute("aria-pressed", String(historyOpen));
          navHistoryButtonEl.title = enabled ? "\u67e5\u770b\u5386\u53f2\u8bdd\u9898" : "\u5f53\u524d\u672a\u542f\u7528\u8bdd\u9898\u4fdd\u5b58";
        }
      }

      function callQtBridge(methodName) {
        if (!qtBridge || typeof qtBridge[methodName] !== "function") {
          return false;
        }
        qtBridge[methodName]();
        return true;
      }

      function openSettingsPage() {
        if (callQtBridge("openSettingsPage")) {
          return;
        }
        const backendBase = String(state.chat.backend_url || "http://127.0.0.1:8008").trim() || "http://127.0.0.1:8008";
        const normalizedBase = backendBase.replace(/\/+$/, "");
        window.open(`${normalizedBase}/settings`, "_blank", "noopener");
      }

      function loadChatPanelState() {
        try {
          const raw = window.localStorage.getItem("desktopPet.chatPanel");
          if (!raw) {
            return null;
          }
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : null;
        } catch (_) {
          return null;
        }
      }

      function saveChatPanelState() {
        if (!chatPanelPositioned) {
          return;
        }
        const payload = {
          left: chatPanelEl.offsetLeft,
          top: chatPanelEl.offsetTop,
          width: chatPanelEl.offsetWidth,
          height: chatPanelEl.offsetHeight,
        };
        try {
          window.localStorage.setItem("desktopPet.chatPanel", JSON.stringify(payload));
        } catch (_) {}
      }

      function parsePetNameFromPrompt(raw) {
        const text = String(raw || "").trim();
        if (!text) {
          return "";
        }
        try {
          const data = JSON.parse(text);
          const character = data && typeof data === "object" ? data.character : null;
          if (character && typeof character === "object") {
            if (character.name_cn) {
              return String(character.name_cn).trim();
            }
            if (character.name) {
              return String(character.name).trim();
            }
          }
          if (data && typeof data === "object" && data.name) {
            return String(data.name).trim();
          }
        } catch (_) {}
        return "";
      }

      function syncPetDisplayName() {
        const parsed = parsePetNameFromPrompt(state.chat?.system_prompt || "");
        const next = String(state.chat?.pet_display_name || parsed || "桌宠").trim() || "桌宠";
        state.chat.pet_display_name = next;
        chatTitleEl.textContent = `${next}对话`;
      }

      function speakerNameForRole(role) {
        return role === "user" ? "你" : String(state.chat?.pet_display_name || "桌宠");
      }

      function normalizeSkillId(value) {
        return String(value || "").trim();
      }

      function normalizeChatMode(value) {
        const mode = String(value || "").trim().toLowerCase();
        return mode === "chat" || mode === "skill" ? mode : "react";
      }

      function normalizeMemoryMode(value) {
        const mode = String(value || "").trim().toLowerCase();
        return mode === "temporary" ? "temporary" : "persistent";
      }

      function dedupeSkillIds(values, allowedIds = null) {
        const allowedSet = Array.isArray(allowedIds) ? new Set(allowedIds.map(normalizeSkillId).filter(Boolean)) : null;
        const seen = new Set();
        const result = [];
        for (const value of values || []) {
          const normalized = normalizeSkillId(value);
          if (!normalized || seen.has(normalized)) {
            continue;
          }
          if (allowedSet && !allowedSet.has(normalized)) {
            continue;
          }
          seen.add(normalized);
          result.push(normalized);
        }
        return result;
      }

      function activeChatSkillIds() {
        if (state.chat?.skills?.enabled === false) {
          return [];
        }
        const allowed = chatSkillCatalog.map((item) => item.id);
        if (!allowed.length) {
          return dedupeSkillIds(chatSelectedSkillIds);
        }
        return dedupeSkillIds(chatSelectedSkillIds, allowed);
      }

      function setChatMode(mode) {
        currentChatMode = normalizeChatMode(mode);
        applyChatModeUI();
      }

      function setMemoryMode(mode) {
        currentMemoryMode = normalizeMemoryMode(mode);
        applyMemoryModeUI();
        renderTopicHistoryList();
        updateShellButtons();
      }

      function applyChatModeUI() {
        for (const button of chatModeButtons) {
          const mode = normalizeChatMode(button.dataset.chatMode);
          const active = mode === currentChatMode;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", active ? "true" : "false");
        }
        const skillsEnabled = currentChatMode !== "chat";
        if (chatSkillsToggleEl) {
          chatSkillsToggleEl.disabled = !skillsEnabled;
          chatSkillsToggleEl.title = skillsEnabled ? "管理当前会话技能" : "聊天模式不使用技能";
        }
        if (!skillsEnabled) {
          chatSkillsDrawerEl.classList.remove("open");
          setChatSkillsStatus("当前是聊天模式，只允许联网搜索工具，不使用技能。");
          return;
        }
        if (currentChatMode === "skill") {
          setChatSkillsStatus(`技能模式当前启用 ${activeChatSkillIds().length} 个技能。`);
          return;
        }
        if (chatSkillsLoaded) {
          setChatSkillsStatus(`当前会话已选择 ${activeChatSkillIds().length} 个技能。`);
        }
      }

      function applyMemoryModeUI() {
        for (const button of memoryModeButtons) {
          const mode = normalizeMemoryMode(button.dataset.memoryMode);
          const active = mode === currentMemoryMode;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", active ? "true" : "false");
        }
        syncTopicIndicator();
      }

      function setChatSkillsStatus(message) {
        if (chatSkillsStatusEl) {
          chatSkillsStatusEl.textContent = String(message || "");
        }
      }

      function normalizeAsrConfig(raw) {
        return {
          enabled: raw?.enabled !== false,
          provider: String(raw?.provider || "funasr").trim() || "funasr",
          api_base_url: String(raw?.api_base_url || "http://127.0.0.1:8012").trim() || "http://127.0.0.1:8012",
          push_to_talk_key: (() => {
            const key = String(raw?.push_to_talk_key || "Alt").trim();
            return ["Alt", "Ctrl", "Space"].includes(key) ? key : "Alt";
          })(),
          interim_results: raw?.interim_results !== false,
        };
      }

      function asrConfig() {
        return normalizeAsrConfig(state.chat?.asr || {});
      }

      function isProbablyMacOS() {
        const platform = String(navigator.userAgentData?.platform || navigator.platform || "").toLowerCase();
        return platform.includes("mac");
      }

      function defaultAsrStatusText() {
        const config = asrConfig();
        if (!config.enabled) {
          if (isProbablyMacOS()) {
            return "[macOS] ASR 默认关闭，聊天仍可用";
          }
          return "\u8bed\u97f3\u8f93\u5165\u5df2\u5173\u95ed";
        }
        return `\u6309\u4f4f ${config.push_to_talk_key} \u8bf4\u8bdd`;
      }

      function activeAsrStatusText() {
        return `\u6309\u4f4f ${asrConfig().push_to_talk_key} \uff1a\u8bed\u97f3\u8f93\u5165\u4e2d\uff0c\u677e\u5f00\u7ed3\u675f`;
      }

      function setAsrStatus(message, tone = "idle") {
        if (!chatAsrStatusEl) {
          return;
        }
        if (asrStatusTimer) {
          clearTimeout(asrStatusTimer);
          asrStatusTimer = 0;
        }
        chatAsrStatusEl.textContent = String(message || defaultAsrStatusText());
        chatAsrStatusEl.classList.toggle("is-active", tone === "active");
        chatAsrStatusEl.classList.toggle("is-error", tone === "error");
        if (tone === "error") {
          asrStatusTimer = window.setTimeout(() => {
            chatAsrStatusEl.classList.remove("is-error");
            chatAsrStatusEl.classList.remove("is-active");
            chatAsrStatusEl.textContent = defaultAsrStatusText();
            asrStatusTimer = 0;
          }, 2600);
        }
      }

      function syncChatInputAvailability() {
        const asrBusy = asrStarting || asrRecording || asrAwaitingFinal;
        chatSendEl.disabled = !canSubmitChatInput() || asrBusy;
        chatInputEl.disabled = chatState === "streaming";
        chatInputEl.readOnly = asrBusy;
      }

      function canSubmitChatInput() {
        return chatState === "idle" || chatState === "awaiting_followup_input";
      }

      function matchesPushToTalkKey(event) {
        const config = asrConfig();
        const key = config.push_to_talk_key;
        if (key === "Ctrl") {
          return event.key === "Control" && !event.altKey && !event.metaKey && !event.shiftKey;
        }
        if (key === "Space") {
          return (event.code === "Space" || event.key === " " || event.key === "Spacebar") && !event.ctrlKey && !event.altKey && !event.metaKey;
        }
        return event.key === "Alt" && !event.ctrlKey && !event.metaKey && !event.shiftKey;
      }

      function canStartPushToTalk(options = {}) {
        const { allowWithoutFocus = false } = options;
        return asrConfig().enabled
          && chatPanelEl.classList.contains("open")
          && chatState === "idle"
          && (allowWithoutFocus || document.hasFocus());
      }

      function shouldHandlePushToTalk(event, options = {}) {
        return !!event && canStartPushToTalk(options);
      }

      function candidateAsrBaseUrls() {
        const seen = new Set();
        const candidates = [
          String(state.chat?.backend_url || "").trim(),
          String(state.chat?.asr?.api_base_url || "").trim(),
        ];
        return candidates.filter((value) => {
          if (!value || seen.has(value)) {
            return false;
          }
          seen.add(value);
          return true;
        });
      }

      function buildAsrWebSocketUrl(baseUrl = "") {
        const asrBaseUrl = String(baseUrl || activeAsrBaseUrl || candidateAsrBaseUrls()[0] || "").trim();
        if (!asrBaseUrl) {
          throw new Error("\u540e\u7aef\u5730\u5740\u672a\u914d\u7f6e");
        }
        const url = new URL(asrBaseUrl);
        url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
        const basePath = url.pathname.replace(/\/+$/, "");
        url.pathname = `${basePath}/api/asr/stream`.replace(/\/+/g, "/");
        url.search = "";
        url.hash = "";
        return url.toString();
      }

      function buildAsrHealthUrl(baseUrl = "") {
        const asrBaseUrl = String(baseUrl || activeAsrBaseUrl || candidateAsrBaseUrls()[0] || "").trim();
        if (!asrBaseUrl) {
          throw new Error("\u540e\u7aef\u5730\u5740\u672a\u914d\u7f6e");
        }
        const url = new URL(asrBaseUrl);
        const basePath = url.pathname.replace(/\/+$/, "");
        url.pathname = `${basePath}/api/health`.replace(/\/+/g, "/");
        url.search = "";
        url.hash = "";
        return url.toString();
      }

      function buildAsrWarmupUrl(baseUrl = "") {
        const asrBaseUrl = String(baseUrl || candidateAsrBaseUrls()[0] || "").trim();
        if (!asrBaseUrl) {
          throw new Error("\u540e\u7aef\u5730\u5740\u672a\u914d\u7f6e");
        }
        const url = new URL(asrBaseUrl);
        const basePath = url.pathname.replace(/\/+$/, "");
        url.pathname = `${basePath}/api/asr/warmup`.replace(/\/+/g, "/");
        url.search = "";
        url.hash = "";
        return url.toString();
      }

      async function probeAsrAvailability() {
        let lastMessage = "ASR \u4e0d\u53ef\u7528";
        for (const baseUrl of candidateAsrBaseUrls()) {
          const controller = typeof AbortController === "function" ? new AbortController() : null;
          const timer = controller
            ? window.setTimeout(() => controller.abort(), 1500)
            : 0;
          try {
            const response = await fetch(buildAsrHealthUrl(baseUrl), {
              method: "GET",
              cache: "no-store",
              signal: controller?.signal,
            });
            const payload = await response.json().catch(() => ({}));
            const failureMessage = String(payload?.message || "ASR \u4e0d\u53ef\u7528").trim() || "ASR \u4e0d\u53ef\u7528";
            lastMessage = failureMessage;
            if (!response.ok || !payload?.asr) {
              continue;
            }
            return {
              ok: true,
              message: "",
              baseUrl,
            };
          } catch (_) {
            lastMessage = "ASR \u4e0d\u53ef\u7528";
          } finally {
            if (timer) {
              clearTimeout(timer);
            }
          }
        }
        return {
          ok: false,
          message: lastMessage,
          baseUrl: "",
        };
      }

      async function requestAsrWarmup() {
        if (callQtBridge("startAsrWarmup")) {
          return;
        }
        for (const baseUrl of candidateAsrBaseUrls()) {
          try {
            await fetch(buildAsrWarmupUrl(baseUrl), {
              method: "POST",
              cache: "no-store",
            });
            return;
          } catch (_) {
            // try next candidate
          }
        }
      }

      function shouldRetryAsrAvailability(message) {
        const text = String(message || "").trim();
        return text.includes("尚未启动") || text.includes("开始初始化") || text.includes("正在加载模型") || text.includes("正在预热");
      }

      function createAsrDraft() {
        const value = String(chatInputEl.value || "");
        const start = Number.isFinite(chatInputEl.selectionStart) ? chatInputEl.selectionStart : value.length;
        const end = Number.isFinite(chatInputEl.selectionEnd) ? chatInputEl.selectionEnd : start;
        asrDraftState = { baseValue: value, start, end };
      }

      function renderAsrDraft(text) {
        if (!asrDraftState) {
          createAsrDraft();
        }
        const draftText = String(text || "");
        const before = asrDraftState.baseValue.slice(0, asrDraftState.start);
        const after = asrDraftState.baseValue.slice(asrDraftState.end);
        chatInputEl.value = `${before}${draftText}${after}`;
        const cursor = before.length + draftText.length;
        chatInputEl.setSelectionRange(cursor, cursor);
      }

      function revertAsrDraft() {
        if (!asrDraftState) {
          return;
        }
        chatInputEl.value = asrDraftState.baseValue;
        chatInputEl.setSelectionRange(asrDraftState.start, asrDraftState.end);
        asrDraftState = null;
        chatInputEl.focus();
      }

      function commitAsrDraft(text) {
        const finalText = String(text || "").trim();
        if (!asrDraftState) {
          if (finalText) {
            chatInputEl.value = `${chatInputEl.value || ""}${finalText}`;
          }
          chatInputEl.focus();
          return;
        }
        if (!finalText) {
          revertAsrDraft();
          return;
        }
        renderAsrDraft(finalText);
        asrDraftState = null;
        chatInputEl.focus();
      }

      function closeAsrSocket() {
        if (!asrSocket) {
          return;
        }
        try {
          asrSocket.onopen = null;
          asrSocket.onmessage = null;
          asrSocket.onerror = null;
          asrSocket.onclose = null;
          if (asrSocket.readyState === WebSocket.OPEN || asrSocket.readyState === WebSocket.CONNECTING) {
            asrSocket.close();
          }
        } catch (_) {}
        asrSocket = null;
      }

      function stopAsrCapturePipeline() {
        if (asrProcessor) {
          try {
            asrProcessor.disconnect();
          } catch (_) {}
        }
        if (asrInputSource) {
          try {
            asrInputSource.disconnect();
          } catch (_) {}
        }
        if (asrSilenceGain) {
          try {
            asrSilenceGain.disconnect();
          } catch (_) {}
        }
        if (asrMediaStream) {
          try {
            for (const track of asrMediaStream.getTracks()) {
              track.stop();
            }
          } catch (_) {}
        }
        if (asrAudioContext) {
          try {
            asrAudioContext.close().catch(() => {});
          } catch (_) {}
        }
        asrProcessor = null;
        asrInputSource = null;
        asrSilenceGain = null;
        asrMediaStream = null;
        asrAudioContext = null;
      }

      function cancelAsrSession(options = {}) {
        const { restoreInput = true, statusMessage = defaultAsrStatusText(), tone = "idle" } = options;
        asrRunToken += 1;
        asrHotkeyPressed = false;
        asrStarting = false;
        asrRecording = false;
        asrAwaitingFinal = false;
        activeAsrBaseUrl = "";
        stopAsrCapturePipeline();
        closeAsrSocket();
        if (restoreInput) {
          revertAsrDraft();
        } else {
          asrDraftState = null;
        }
        syncChatInputAvailability();
        setAsrStatus(statusMessage, tone);
      }

      function handleAsrPartial(text) {
        const partialText = String(text || "");
        if (!partialText) {
          return;
        }
        renderAsrDraft(partialText);
      }

      function handleAsrFinal(text) {
        const finalText = String(text || "");
        stopAsrCapturePipeline();
        closeAsrSocket();
        asrHotkeyPressed = false;
        asrStarting = false;
        asrRecording = false;
        asrAwaitingFinal = false;
        commitAsrDraft(finalText);
        syncChatInputAvailability();
        setAsrStatus(defaultAsrStatusText(), "idle");
      }

      function handleAsrError(error) {
        cancelAsrSession({
          restoreInput: true,
          statusMessage: `\u8bed\u97f3\u8f93\u5165\u5931\u8d25\uff1a${error?.message || String(error)}`,
          tone: "error",
        });
      }

      function downsampleFloat32ToInt16Buffer(input, inputSampleRate, outputSampleRate = 16000) {
        const source = input instanceof Float32Array ? input : new Float32Array(input || []);
        if (!source.length) {
          return new ArrayBuffer(0);
        }
        if (inputSampleRate === outputSampleRate) {
          const direct = new Int16Array(source.length);
          for (let index = 0; index < source.length; index += 1) {
            const sample = Math.max(-1, Math.min(1, source[index] || 0));
            direct[index] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
          }
          return direct.buffer;
        }
        const ratio = inputSampleRate / outputSampleRate;
        const length = Math.max(1, Math.round(source.length / ratio));
        const result = new Int16Array(length);
        let offsetSource = 0;
        for (let offsetResult = 0; offsetResult < length; offsetResult += 1) {
          const nextOffsetSource = Math.min(source.length, Math.round((offsetResult + 1) * ratio));
          let total = 0;
          let count = 0;
          for (let index = offsetSource; index < nextOffsetSource; index += 1) {
            total += source[index];
            count += 1;
          }
          const sample = Math.max(-1, Math.min(1, count ? total / count : 0));
          result[offsetResult] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
          offsetSource = nextOffsetSource;
        }
        return result.buffer;
      }

      async function openAsrSocket(token) {
        return await new Promise((resolve, reject) => {
          let settled = false;
          let sawSocketError = false;
          let lastSocketErrorMessage = "";
          const socket = new WebSocket(buildAsrWebSocketUrl());
          socket.binaryType = "arraybuffer";
          asrSocket = socket;

          const fail = (error) => {
            if (settled) {
              return;
            }
            settled = true;
            reject(error);
          };

          socket.onopen = () => {
            if (token !== asrRunToken) {
              fail(new Error("ASR start cancelled"));
              return;
            }
            try {
              socket.send(JSON.stringify({
                type: "start",
                key: asrConfig().push_to_talk_key,
                language: "zh",
                punctuation: true,
                interim_results: asrConfig().interim_results,
              }));
            } catch (error) {
              fail(error);
            }
          };

          socket.onmessage = (event) => {
            let payload = null;
            try {
              payload = JSON.parse(String(event.data || "{}"));
            } catch (_) {
              return;
            }
            const type = String(payload?.type || "");
            if (type === "ready") {
              if (!settled) {
                settled = true;
                resolve(payload);
              }
              return;
            }
            if (type === "partial") {
              handleAsrPartial(String(payload?.text || ""));
              return;
            }
            if (type === "final") {
              handleAsrFinal(String(payload?.text || ""));
              return;
            }
            if (type === "error") {
              lastSocketErrorMessage = String(payload?.message || "ASR 错误");
              fail(new Error(lastSocketErrorMessage));
            }
          };

          socket.onerror = () => {
            sawSocketError = true;
          };

          socket.onclose = () => {
            if (!settled && token === asrRunToken && (asrStarting || asrRecording || asrAwaitingFinal)) {
              fail(new Error(lastSocketErrorMessage || (sawSocketError ? "ASR WebSocket 连接错误" : "ASR 连接已关闭")));
            }
          };
        });
      }

      async function startAsrCapturePipeline(token) {
        const mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (token !== asrRunToken) {
          for (const track of mediaStream.getTracks()) {
            track.stop();
          }
          throw new Error("ASR start cancelled");
        }
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) {
          for (const track of mediaStream.getTracks()) {
            track.stop();
          }
          throw new Error("\u5f53\u524d\u73af\u5883\u4e0d\u652f\u6301\u97f3\u9891\u91c7\u96c6");
        }
        const context = new AudioCtor();
        if (typeof context.resume === "function") {
          await context.resume().catch(() => {});
        }
        const source = context.createMediaStreamSource(mediaStream);
        const processor = context.createScriptProcessor(4096, 1, 1);
        const silenceGain = context.createGain();
        silenceGain.gain.value = 0;
        processor.onaudioprocess = (event) => {
          if (token !== asrRunToken || !asrRecording || !asrSocket || asrSocket.readyState !== WebSocket.OPEN) {
            return;
          }
          const channelData = event.inputBuffer.getChannelData(0);
          const audioBuffer = downsampleFloat32ToInt16Buffer(channelData, context.sampleRate, 16000);
          if (audioBuffer.byteLength) {
            asrSocket.send(audioBuffer);
          }
        };
        source.connect(processor);
        processor.connect(silenceGain);
        silenceGain.connect(context.destination);
        asrAudioContext = context;
        asrMediaStream = mediaStream;
        asrInputSource = source;
        asrProcessor = processor;
        asrSilenceGain = silenceGain;
      }

      async function startPushToTalk() {
        if (!canStartPushToTalk()) {
          return;
        }
        if (asrStarting || asrRecording || asrAwaitingFinal) {
          return;
        }
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") {
          setAsrStatus("\u5f53\u524d\u73af\u5883\u4e0d\u652f\u6301\u9ea6\u514b\u98ce\u91c7\u96c6", "error");
          return;
        }
        asrHotkeyPressed = true;
        const token = asrRunToken + 1;
        asrRunToken = token;
        asrStarting = true;
        syncChatInputAvailability();
        setAsrStatus(activeAsrStatusText(), "active");
        await requestAsrWarmup();
        let availability = await probeAsrAvailability();
        while (token === asrRunToken && asrHotkeyPressed && !availability.ok) {
          if (!shouldRetryAsrAvailability(availability.message)) {
            break;
          }
          setAsrStatus(availability.message || "ASR \u6b63\u5728\u52a0\u8f7d\u6a21\u578b\uff0c\u8bf7\u7ee7\u7eed\u6309\u4f4f\u70ed\u952e\u7b49\u5f85\u3002", "active");
          await new Promise((resolve) => window.setTimeout(resolve, 1000));
          availability = await probeAsrAvailability();
        }
        if (token !== asrRunToken || !asrHotkeyPressed) {
          cancelAsrSession({ restoreInput: true, statusMessage: defaultAsrStatusText(), tone: "idle" });
          return;
        }
        if (!availability.ok) {
          asrStarting = false;
          syncChatInputAvailability();
          setAsrStatus(availability.message || "ASR \u4e0d\u53ef\u7528", shouldRetryAsrAvailability(availability.message) ? "active" : "error");
          return;
        }
        activeAsrBaseUrl = String(availability.baseUrl || "").trim();
        createAsrDraft();
        renderAsrDraft("");
        try {
          await openAsrSocket(token);
          if (token !== asrRunToken || !asrHotkeyPressed) {
            throw new Error("ASR start cancelled");
          }
          await startAsrCapturePipeline(token);
          if (token !== asrRunToken || !asrHotkeyPressed) {
            throw new Error("ASR start cancelled");
          }
          asrStarting = false;
          asrRecording = true;
          syncChatInputAvailability();
          setAsrStatus(activeAsrStatusText(), "active");
        } catch (error) {
          if (String(error?.message || error) === "ASR start cancelled") {
            cancelAsrSession({ restoreInput: true, statusMessage: defaultAsrStatusText(), tone: "idle" });
            return;
          }
          handleAsrError(error);
        }
      }

      function stopPushToTalk() {
        asrHotkeyPressed = false;
        if (asrStarting) {
          cancelAsrSession({ restoreInput: true, statusMessage: defaultAsrStatusText(), tone: "idle" });
          return;
        }
        if (!asrRecording) {
          return;
        }
        asrRecording = false;
        asrAwaitingFinal = true;
        stopAsrCapturePipeline();
        syncChatInputAvailability();
        setAsrStatus("\u6b63\u5728\u8bc6\u522b...", "active");
        if (!asrSocket || asrSocket.readyState !== WebSocket.OPEN) {
          handleAsrError(new Error("ASR 连接不可用"));
          return;
        }
        try {
          asrSocket.send(JSON.stringify({ type: "stop" }));
        } catch (error) {
          handleAsrError(error);
        }
      }

      function topicHistoryEnabled() {
        return true;
      }

      function setChatHistoryStatus(message) {
        if (chatHistoryStatusEl) {
          chatHistoryStatusEl.textContent = String(message || "");
        }
      }

      function normalizeTopicRecord(raw) {
        if (!raw || typeof raw !== "object") {
          return null;
        }
        const topic_id = String(raw.topic_id || raw.session_id || raw.id || "").trim();
        if (!topic_id) {
          return null;
        }
        return {
          topic_id,
          title: String(raw.title || "新话题").trim() || "新话题",
          preview: String(raw.preview || "").trim(),
          updated_at: String(raw.updated_at || raw.created_at || "").trim(),
          created_at: String(raw.created_at || "").trim(),
          persisted: raw.persisted !== false,
          assistant_turn_count: Number(raw.assistant_turn_count || 0) || 0,
          source: String(raw.source || "").trim(),
          supports_history_detail: raw.supports_history_detail !== false,
          supports_delete: raw.supports_delete !== false,
          history_unavailable: !!raw.history_unavailable,
        };
      }

      function currentTopicLabel() {
        if (currentMemoryMode === "temporary") {
          return "临时聊天";
        }
        return currentTopicMeta?.title || currentTopicId || "未创建";
      }

      function syncTopicIndicator() {
        if (chatHistoryCurrentEl) {
          chatHistoryCurrentEl.textContent = `当前话题：${currentTopicLabel()}`;
        }
      }

      function replaceChatMessages(messages) {
        if (!chatMessagesEl) {
          return;
        }
        clearPendingRetryEdit();
        chatMessagesEl.innerHTML = "";
        currentThoughtGroup = null;
        currentAssistantWorklog = null;
        approvalBubbleRefs.clear();
        approvalThoughtSessionRefs.clear();
        hideHumanOpsClickPreview();
        for (const item of Array.isArray(messages) ? messages : []) {
          if (!item || typeof item !== "object") {
            continue;
          }
          const role = String(item.role || "").trim();
          if (role !== "user" && role !== "assistant") {
            continue;
          }
          if (role === "user") {
            appendMessage("user", String(item.content || ""), {
              speakerName: "你",
              assistantTurn: Number(item.assistant_turn || 0) || null,
            });
          } else {
            appendAssistantHistoryBlock(item);
          }
        }
      }

      function clearPendingDeleteTopic(shouldRender = true) {
        const hadPending = !!pendingDeleteTopicId;
        pendingDeleteTopicId = "";
        if (pendingDeleteTopicTimer) {
          window.clearTimeout(pendingDeleteTopicTimer);
          pendingDeleteTopicTimer = null;
        }
        if (hadPending && shouldRender) {
          renderTopicHistoryList();
        }
      }

      function armPendingDeleteTopic(topicId, topicTitle = "") {
        const normalizedTopicId = String(topicId || "").trim();
        if (!normalizedTopicId) {
          return;
        }
        const displayTitle = String(topicTitle || normalizedTopicId).trim() || normalizedTopicId;
        pendingDeleteTopicId = normalizedTopicId;
        if (pendingDeleteTopicTimer) {
          window.clearTimeout(pendingDeleteTopicTimer);
        }
        pendingDeleteTopicTimer = window.setTimeout(() => {
          pendingDeleteTopicId = "";
          pendingDeleteTopicTimer = null;
          setChatHistoryStatus(`已取消删除：${displayTitle}`);
          renderTopicHistoryList();
        }, 5000);
        renderTopicHistoryList();
        setChatHistoryStatus(`再次点击“确认删除”即可删除话题：${displayTitle}`);
      }

      function renderTopicHistoryList() {
        if (!chatHistoryListEl) {
          return;
        }
        chatHistoryListEl.innerHTML = "";
        if (currentMemoryMode === "temporary") {
          setChatHistoryStatus("临时聊天不会写入历史。");
          syncTopicIndicator();
          return;
        }
        if (!topicHistoryEnabled()) {
          setChatHistoryStatus("当前未启用话题保存。你仍然可以点击“新对话”创建临时会话。");
          syncTopicIndicator();
          return;
        }
        if (!topicHistoryItems.length) {
          setChatHistoryStatus(topicHistoryLoading ? "正在加载话题列表..." : "还没有可切换的历史话题。");
          syncTopicIndicator();
          return;
        }
        setChatHistoryStatus(`共找到 ${topicHistoryItems.length} 个已保存话题。`);
        syncTopicIndicator();
        const pendingTopic = topicHistoryItems.find((item) => item.topic_id === pendingDeleteTopicId) || null;
        for (const item of topicHistoryItems) {
          const card = document.createElement("div");
          card.className = "chat-history-item";
          if (item.topic_id === currentTopicId) {
            card.classList.add("is-active");
          }
          const mainButton = document.createElement("button");
          mainButton.type = "button";
          mainButton.className = "chat-history-main";
          const titleEl = document.createElement("strong");
          titleEl.textContent = item.title;
          const previewEl = document.createElement("div");
          previewEl.className = "chat-history-preview";
          previewEl.textContent = item.preview || "暂无摘要，打开后继续聊聊吧。";
          const metaEl = document.createElement("div");
          metaEl.className = "chat-history-meta";
          metaEl.textContent = `${item.updated_at || item.created_at || "未知时间"} | AI ${item.assistant_turn_count} 轮`;
          mainButton.appendChild(titleEl);
          mainButton.appendChild(previewEl);
          mainButton.appendChild(metaEl);
          mainButton.addEventListener("click", async () => {
            await selectTopic(item.topic_id);
          });
          card.appendChild(mainButton);
          if (item.supports_delete) {
            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            const isPendingDelete = item.topic_id === pendingDeleteTopicId;
            deleteButton.className = `chat-history-delete${isPendingDelete ? " is-danger" : ""}`;
            deleteButton.textContent = isPendingDelete ? "\u786e\u8ba4\u5220\u9664" : "\u5220\u9664";
            deleteButton.title = isPendingDelete ? "\u518d\u6b21\u70b9\u51fb\u5373\u5220\u9664\u8bdd\u9898" : "\u5220\u9664\u8bdd\u9898";
            deleteButton.setAttribute("aria-label", isPendingDelete ? "\u786e\u8ba4\u5220\u9664\u8bdd\u9898" : "\u5220\u9664\u8bdd\u9898");
            deleteButton.addEventListener("click", async (event) => {
              event.preventDefault();
              event.stopPropagation();
              await deleteTopic(item.topic_id, item.title);
            });
            card.appendChild(deleteButton);
          }
          chatHistoryListEl.appendChild(card);
        }
        if (pendingTopic) {
          setChatHistoryStatus(`\u518d\u6b21\u70b9\u51fb\u201c\u786e\u8ba4\u5220\u9664\u201d\u5373\u53ef\u5220\u9664\u8bdd\u9898\uff1a${pendingTopic.title}`);
        }
      }

      async function loadTopicHistory(force = false) {
        if (currentMemoryMode === "temporary") {
          renderTopicHistoryList();
          return [];
        }
        if (!topicHistoryEnabled()) {
          topicHistoryItems = [];
          topicHistoryLoaded = false;
          renderTopicHistoryList();
          return [];
        }
        if (topicHistoryLoaded && !force) {
          renderTopicHistoryList();
          return topicHistoryItems;
        }
        const backend = (state.chat?.backend_url || "").replace(/\/$/, "");
        if (!backend) {
          setChatHistoryStatus("后端地址未配置，无法加载历史话题。");
          return [];
        }
        topicHistoryLoading = true;
        setChatHistoryStatus("正在加载话题列表...");
        try {
          const resp = await fetch(`${backend}/api/chat/topics`);
          const payload = await resp.json();
          if (!resp.ok) {
            throw new Error(payload.detail || `HTTP ${resp.status}`);
          }
          topicHistoryItems = (Array.isArray(payload.topics) ? payload.topics : [])
            .map(normalizeTopicRecord)
            .filter(Boolean);
          topicHistoryLoaded = true;
          currentTopicMeta = topicHistoryItems.find((item) => item.topic_id === currentTopicId) || currentTopicMeta;
          renderTopicHistoryList();
          updateShellButtons();
          return topicHistoryItems;
        } catch (error) {
          topicHistoryLoaded = false;
          topicHistoryItems = [];
          setChatHistoryStatus(`历史话题加载失败：${error?.message || String(error)}`);
          renderTopicHistoryList();
          return [];
        } finally {
          topicHistoryLoading = false;
        }
      }

      async function createNewTopic(shouldOpen = true) {
        const backend = (state.chat?.backend_url || "").replace(/\/$/, "");
        if (!backend) {
          const fallbackId = `topic-${Date.now()}`;
          currentTopicId = fallbackId;
          state.chat.session_id = fallbackId;
          currentTopicMeta = normalizeTopicRecord({ topic_id: fallbackId, title: "临时会话", persisted: false });
          clearPendingDeleteTopic(false);
          replaceChatMessages([]);
          topicHistoryLoaded = false;
          if (shouldOpen) {
            openChat();
          }
          renderTopicHistoryList();
          updateShellButtons();
          return currentTopicMeta;
        }
        try {
          const resp = await fetch(`${backend}/api/chat/topics`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}),
          });
          const payload = await resp.json();
          if (!resp.ok) {
            throw new Error(payload.detail || `HTTP ${resp.status}`);
          }
          const topic = normalizeTopicRecord(payload.topic || { topic_id: payload.topic_id, persisted: payload.persisted });
          if (topic) {
            currentTopicId = topic.topic_id;
            state.chat.session_id = topic.topic_id;
            currentTopicMeta = topic;
          }
          clearPendingDeleteTopic(false);
          replaceChatMessages([]);
          toggleChatSkillsDrawer(false);
          toggleChatHistoryDrawer(false);
          topicHistoryLoaded = false;
          if (topicHistoryEnabled()) {
            await loadTopicHistory(true);
          } else {
            renderTopicHistoryList();
          }
          if (shouldOpen) {
            openChat();
          }
          return topic;
        } catch (error) {
          appendMessage("error", `创建新话题失败：${error?.message || String(error)}`, { speakerName: "系统" });
          return null;
        }
      }

      async function loadTopicDetail(topicId) {
        const backend = (state.chat?.backend_url || "").replace(/\/$/, "");
        if (!backend) {
          throw new Error("后端地址未配置");
        }
        const resp = await fetch(`${backend}/api/chat/topics/${encodeURIComponent(topicId)}`);
        const payload = await resp.json();
        if (!resp.ok || payload.ok === false) {
          throw new Error(payload.detail || `HTTP ${resp.status}`);
        }
        return payload;
      }

      async function selectTopic(topicId) {
        clearPendingDeleteTopic(false);
        try {
          const payload = await loadTopicDetail(topicId);
          const meta = normalizeTopicRecord(payload.meta || { topic_id: topicId });
          currentTopicId = String(topicId || "").trim() || currentTopicId;
          state.chat.session_id = currentTopicId;
          currentTopicMeta = meta;
          replaceChatMessages(payload.history_unavailable ? [] : Array.isArray(payload.messages) ? payload.messages : []);
          if (payload.history_unavailable) {
            appendMessage("error", payload.detail || "当前运行时暂时无法同步该会话历史。", {
              speakerName: "系统",
            });
          }
          toggleChatHistoryDrawer(false);
          openChat();
          renderTopicHistoryList();
          updateShellButtons();
        } catch (error) {
          appendMessage("error", `读取历史话题失败：${error?.message || String(error)}`, { speakerName: "系统" });
        }
      }

      async function deleteTopic(topicId, topicTitle = "") {
        const normalizedTopicId = String(topicId || "").trim();
        if (!normalizedTopicId) {
          return;
        }
        const backend = (state.chat?.backend_url || "").replace(/\/$/, "");
        if (!backend) {
          setChatHistoryStatus("\u540e\u7aef\u5730\u5740\u672a\u914d\u7f6e\uff0c\u65e0\u6cd5\u5220\u9664\u5386\u53f2\u8bdd\u9898\u3002");
          return;
        }
        const displayTitle = String(topicTitle || normalizedTopicId).trim() || normalizedTopicId;
        const topicMeta = topicHistoryItems.find((item) => item.topic_id === normalizedTopicId) || null;
        if (topicMeta && !topicMeta.supports_delete) {
          setChatHistoryStatus("该话题当前不支持同步删除。");
          return;
        }
        if (pendingDeleteTopicId !== normalizedTopicId) {
          armPendingDeleteTopic(normalizedTopicId, displayTitle);
          return;
        }
        clearPendingDeleteTopic(false);
        setChatHistoryStatus(`正在删除话题：${displayTitle}...`);
        const parsePayload = async (resp) => {
          const rawText = await resp.text();
          if (!rawText) {
            return {};
          }
          try {
            return JSON.parse(rawText);
          } catch {
            return { detail: rawText };
          }
        };
        try {
          let resp = await fetch(`${backend}/api/chat/topics/${encodeURIComponent(normalizedTopicId)}`, {
            method: "DELETE",
          });
          let payload = await parsePayload(resp);
          if (resp.status === 405) {
            resp = await fetch(`${backend}/api/chat/topics/${encodeURIComponent(normalizedTopicId)}/delete`, {
              method: "POST",
            });
            payload = await parsePayload(resp);
          }
          if (Array.isArray(payload.topics)) {
            topicHistoryItems = payload.topics.map(normalizeTopicRecord).filter(Boolean);
            topicHistoryLoaded = true;
            renderTopicHistoryList();
            updateShellButtons();
          }
          if (!resp.ok || payload.ok === false) {
            throw new Error(payload.detail || `HTTP ${resp.status}`);
          }
          clearPendingDeleteTopic(false);
          if (!Array.isArray(payload.topics)) {
            topicHistoryItems = [];
            topicHistoryLoaded = true;
          }
          if (currentTopicId === normalizedTopicId) {
            if (topicHistoryItems.length) {
              await selectTopic(topicHistoryItems[0].topic_id);
            } else {
              currentTopicId = "";
              state.chat.session_id = "";
              currentTopicMeta = null;
              await createNewTopic(false);
            }
          } else {
            renderTopicHistoryList();
            updateShellButtons();
          }
          setChatHistoryStatus(`\u5df2\u5220\u9664\u8bdd\u9898\uff1a${displayTitle}`);
        } catch (error) {
          clearPendingDeleteTopic(false);
          setChatHistoryStatus(`\u5220\u9664\u5386\u53f2\u8bdd\u9898\u5931\u8d25\uff1a${error?.message || String(error)}\u3002`);
          renderTopicHistoryList();
        }
      }

      async function ensureTopicReady() {
        if (currentTopicId && currentTopicId !== "default") {
          state.chat.session_id = currentTopicId;
          return currentTopicId;
        }
        if (chatMessagesEl.childElementCount > 0) {
          return state.chat.session_id || currentTopicId || "default";
        }
        const topic = await createNewTopic(false);
        return topic?.topic_id || state.chat.session_id || currentTopicId || "default";
      }

      function toggleChatHistoryDrawer(forceOpen = null) {
        if (!chatHistoryDrawerEl) {
          return;
        }
        if (!topicHistoryEnabled()) {
          chatHistoryDrawerEl.classList.remove("open");
          updateShellButtons();
          renderTopicHistoryList();
          return;
        }
        const shouldOpen = forceOpen === null ? !chatHistoryDrawerEl.classList.contains("open") : !!forceOpen;
        chatHistoryDrawerEl.classList.toggle("open", shouldOpen);
        if (shouldOpen) {
          chatSkillsDrawerEl.classList.remove("open");
          loadTopicHistory(false);
        }
        updateShellButtons();
      }

      function normalizeSkillRecord(raw) {
        if (!raw || typeof raw !== "object") {
          return null;
        }
        const id = normalizeSkillId(raw.id || raw.skill_id || raw.slug || raw.name);
        if (!id) {
          return null;
        }
        const sourceValue = String(raw.source || raw.origin || raw.source_type || "").toLowerCase();
        const builtin = !!raw.builtin || sourceValue === "builtin";
        const imported = !!raw.imported || sourceValue === "imported" || (!builtin && sourceValue !== "builtin");
        return {
          id,
          name: String(raw.name || raw.title || id),
          description: String(raw.description || raw.summary || ""),
          source: builtin ? "builtin" : "imported",
          builtin,
          imported,
          scriptCount: Number(raw.script_count || 0) || 0,
          allowlistCount: Number(raw.allowlist_count || 0) || 0,
        };
      }

      function renderChatSkillDrawer() {
        if (!chatSkillsListEl) {
          return;
        }
        chatSkillsListEl.innerHTML = "";
        if (!chatSkillCatalog.length) {
          chatSkillsListEl.innerHTML = '<div class="chat-skill-card"><p>当前没有可用技能，或后端还没有提供 `/api/skills` 接口。</p></div>';
          return;
        }
        const activeSet = new Set(activeChatSkillIds());
        for (const item of chatSkillCatalog) {
          const card = document.createElement("article");
          card.className = "chat-skill-card";
          card.innerHTML = `
            <h4>${item.name}</h4>
            <p>${item.description || "暂无描述。"}</p>
            <div class="chat-skill-meta">${item.builtin ? "内置" : "第三方"} | 脚本 ${item.scriptCount} | 工具白名单 ${item.allowlistCount}</div>
          `;
          const label = document.createElement("label");
          label.className = "chat-skill-toggle";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = activeSet.has(item.id);
          input.addEventListener("change", () => {
            const next = new Set(activeChatSkillIds());
            if (input.checked) {
              next.add(item.id);
            } else {
              next.delete(item.id);
            }
            chatSelectedSkillIds = dedupeSkillIds([...next], chatSkillCatalog.map((entry) => entry.id));
            applyChatModeUI();
          });
          const text = document.createElement("span");
          text.textContent = "本轮/本会话启用";
          label.appendChild(input);
          label.appendChild(text);
          card.appendChild(label);
          chatSkillsListEl.appendChild(card);
        }
      }

      async function loadChatSkills(force = false) {
        if (chatSkillsLoaded && !force) {
          return;
        }
        const backend = (state.chat?.backend_url || "").replace(/\/$/, "");
        if (!backend) {
          setChatSkillsStatus("后端地址未配置，无法加载技能。");
          return;
        }
        setChatSkillsStatus("正在加载技能列表...");
        try {
          const resp = await fetch(`${backend}/api/skills`);
          const payload = await resp.json();
          if (!resp.ok) {
            throw new Error(payload.detail || `HTTP ${resp.status}`);
          }
          const rawItems = Array.isArray(payload.skills)
            ? payload.skills
            : Array.isArray(payload.items)
              ? payload.items
              : [];
          chatSkillCatalog = rawItems.map(normalizeSkillRecord).filter(Boolean);
          chatSkillDefaultIds = dedupeSkillIds(
            payload.default_active_ids || state.chat?.skills?.default_active_ids || [],
            chatSkillCatalog.map((item) => item.id),
          );
          if (!chatSelectedSkillIds.length || force) {
            chatSelectedSkillIds = chatSkillDefaultIds.slice();
          } else {
            chatSelectedSkillIds = dedupeSkillIds(chatSelectedSkillIds, chatSkillCatalog.map((item) => item.id));
          }
          chatSkillsLoaded = true;
          renderChatSkillDrawer();
          applyChatModeUI();
        } catch (error) {
          chatSkillCatalog = [];
          chatSkillDefaultIds = [];
          chatSelectedSkillIds = [];
          chatSkillsLoaded = false;
          setChatSkillsStatus(`技能加载失败：${error?.message || String(error)}`);
          renderChatSkillDrawer();
        }
      }

      function toggleChatSkillsDrawer(forceOpen = null) {
        if (currentChatMode === "chat") {
          setChatSkillsStatus("\u5f53\u524d\u662f\u804a\u5929\u6a21\u5f0f\uff0c\u53ea\u5141\u8bb8\u8054\u7f51\u641c\u7d22\u5de5\u5177\uff0c\u4e0d\u4f7f\u7528\u6280\u80fd\u3002");
          chatSkillsDrawerEl.classList.remove("open");
          updateShellButtons();
          return;
        }
        const shouldOpen = forceOpen === null ? !chatSkillsDrawerEl.classList.contains("open") : !!forceOpen;
        chatSkillsDrawerEl.classList.toggle("open", shouldOpen);
        if (shouldOpen) {
          chatHistoryDrawerEl.classList.remove("open");
          loadChatSkills(false);
        }
        updateShellButtons();
      }

      function resetChatSkillsToDefault() {
        chatSelectedSkillIds = chatSkillDefaultIds.slice();
        renderChatSkillDrawer();
        applyChatModeUI();
      }

      function phaseLabel(phase) {
        const value = String(phase || "").trim().toLowerCase();
        if (value === "thought") {
          return "思考中";
        }
        if (value === "action") {
          return "行动中";
        }
        if (value === "done") {
          return "已完成";
        }
        return "";
      }

      function thoughtRoleLabel(role) {
        const value = String(role || "").trim().toLowerCase();
        if (value === "decider") {
          return "决策";
        }
        if (value === "searcher") {
          return "搜索";
        }
        if (value === "planner") {
          return "规划";
        }
        if (value === "writer") {
          return "写作";
        }
        return "思考";
      }

      function formatStepMeta(payload) {
        const stepIndex = Number(payload?.step_index || 0);
        const stepTitle = String(payload?.step_title || "").trim();
        const batchSize = Number(payload?.batch_size || 0);
        const batchId = String(payload?.batch_id || "").trim();
        const parts = [];
        if (stepIndex > 0) {
          parts.push(stepTitle ? `步骤 ${stepIndex}：${stepTitle}` : `步骤 ${stepIndex}`);
        }
        if (batchSize > 0) {
          parts.push(`批次：${batchSize} 次工具调用`);
        }
        if (batchId) {
          parts.push(`批次 ID：${batchId}`);
        }
        return parts.join("\n");
      }

      function removeApprovalBubble(turnId) {
        const key = String(turnId || "").trim();
        if (!key) {
          return;
        }
        const ref = approvalBubbleRefs.get(key);
        if (ref && ref.el && ref.el.parentNode) {
          ref.el.remove();
        }
        approvalBubbleRefs.delete(key);
        hideHumanOpsClickPreview();
      }

      function hideHumanOpsClickPreview() {
        if (humanOpsClickPreviewEl && humanOpsClickPreviewEl.parentNode) {
          humanOpsClickPreviewEl.remove();
        }
        humanOpsClickPreviewEl = null;
        if (qtBridge && typeof qtBridge.hideClickPreview === "function") {
          qtBridge.hideClickPreview();
        }
      }

      function showHumanOpsClickPreview(preview) {
        hideHumanOpsClickPreview();
        if (!preview || preview.marker !== "red_dot") {
          return;
        }
        const x = Number(preview.x);
        const y = Number(preview.y);
        if (!Number.isFinite(x) || !Number.isFinite(y)) {
          return;
        }
        const viewportX = x - (Number(window.screenX) || 0);
        const viewportY = y - (Number(window.screenY) || 0);
        const dot = document.createElement("span");
        dot.id = "human-ops-click-preview-dot";
        dot.className = "human-ops-click-preview-dot";
        dot.style.left = `${Math.max(0, Math.min(window.innerWidth, viewportX))}px`;
        dot.style.top = `${Math.max(0, Math.min(window.innerHeight, viewportY))}px`;
        dot.title = String(preview.label || "目标位置");
        document.body.appendChild(dot);
        humanOpsClickPreviewEl = dot;
        if (qtBridge && typeof qtBridge.showClickPreview === "function") {
          qtBridge.showClickPreview(JSON.stringify(preview));
        }
      }

      function createThoughtSessionId() {
        thoughtSessionCounter += 1;
        return `thought-session-${thoughtSessionCounter}`;
      }

      function beginThoughtSession(existingSessionId = "") {
        const nextSessionId = String(existingSessionId || "").trim() || createThoughtSessionId();
        activeThoughtSessionId = nextSessionId;
        return nextSessionId;
      }

      function clearActiveThoughtSession(sessionId = "") {
        const normalizedSessionId = String(sessionId || "").trim();
        if (normalizedSessionId && activeThoughtSessionId && activeThoughtSessionId !== normalizedSessionId) {
          return;
        }
        activeThoughtSessionId = "";
        currentThoughtGroup = null;
      }

      function buildThoughtGroup(round, speakerName, pending = false, sessionId = "") {
        const el = document.createElement("article");
        el.className = `msg pet phase-thought thought-group${pending ? " pending" : ""}`;

        const headEl = document.createElement("div");
        headEl.className = "msg-head";

        const speakerEl = document.createElement("div");
        speakerEl.className = "speaker-pill";
        speakerEl.textContent = String(speakerName || speakerNameForRole("pet"));
        headEl.appendChild(speakerEl);

        const phaseEl = document.createElement("div");
        phaseEl.className = "phase-pill";
        phaseEl.textContent = `思考中：当前第${round}轮`;
        headEl.appendChild(phaseEl);

        const bodyEl = document.createElement("div");
        bodyEl.className = "msg-body";

        const hintEl = document.createElement("div");
        hintEl.className = "thought-group-hint";
        hintEl.textContent = "这轮思路会整理在下面，点开就能看细节。";

        const detailsEl = document.createElement("details");
        detailsEl.className = "thought-details";

        const summaryEl = document.createElement("summary");
        summaryEl.textContent = "查看思考详情";

        const itemsEl = document.createElement("div");
        itemsEl.className = "thought-items";

        detailsEl.appendChild(summaryEl);
        detailsEl.appendChild(itemsEl);
        bodyEl.appendChild(hintEl);
        bodyEl.appendChild(detailsEl);

        el.appendChild(headEl);
        el.appendChild(bodyEl);
        chatMessagesEl.appendChild(el);
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        return { el, bodyEl, hintEl, detailsEl, itemsEl, round, hasItems: false, sessionId: String(sessionId || "").trim() };
      }

      function ensureThoughtGroup(round = 1, pending = false, sessionId = "") {
        const normalizedRound = Math.max(1, Number(round) || 1);
        const normalizedSessionId = String(sessionId || activeThoughtSessionId || "").trim() || beginThoughtSession();
        if (
          currentThoughtGroup &&
          currentThoughtGroup.round === normalizedRound &&
          currentThoughtGroup.sessionId === normalizedSessionId
        ) {
          currentThoughtGroup.el.classList.toggle("pending", !!pending);
          return currentThoughtGroup;
        }
        if (currentThoughtGroup && !currentThoughtGroup.hasItems && currentThoughtGroup.el && currentThoughtGroup.el.parentNode) {
          currentThoughtGroup.el.remove();
        }
        currentThoughtGroup = buildThoughtGroup(normalizedRound, speakerNameForRole("pet"), pending, normalizedSessionId);
        return currentThoughtGroup;
      }

      function removeEmptyPendingThoughtGroup(sessionId = "") {
        if (!currentThoughtGroup || currentThoughtGroup.hasItems) {
          return;
        }
        const normalizedSessionId = String(sessionId || "").trim();
        if (normalizedSessionId && currentThoughtGroup.sessionId !== normalizedSessionId) {
          return;
        }
        if (currentThoughtGroup.el && currentThoughtGroup.el.parentNode) {
          currentThoughtGroup.el.remove();
        }
        currentThoughtGroup = null;
      }

      function appendThoughtPhase(payload, sessionId = "") {
        const round = Math.max(1, Number(payload?.loop_round) || (currentThoughtGroup ? currentThoughtGroup.round : 1));
        const group = ensureThoughtGroup(round, false, sessionId);
        group.el.classList.remove("pending");
        group.hintEl.textContent = `这轮已经整理出 ${group.hasItems ? "更多" : "一些"}思路啦，点开就能看细节。`;

        const itemEl = document.createElement("div");
        itemEl.className = "thought-item";

        const roleEl = document.createElement("div");
        roleEl.className = "thought-role-pill";
        roleEl.textContent = thoughtRoleLabel(payload?.thought_role);

        const textEl = document.createElement("div");
        textEl.className = "thought-item-text";
        const metaText = formatStepMeta(payload);
        textEl.textContent = metaText ? `${metaText}\n${String(payload?.text || "")}` : String(payload?.text || "");

        itemEl.appendChild(roleEl);
        itemEl.appendChild(textEl);
        group.itemsEl.appendChild(itemEl);
        group.hasItems = true;
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        return group;
      }

      function sourceLabel(source) {
        const value = String(source || "").trim();
        if (value === "ipet_inferred") {
          return "Ipet 推断";
        }
        if (value === "brain") {
          return "Brain";
        }
        if (value === "human_ops") {
          return "Human Ops";
        }
        return value || "状态";
      }

      function buildAssistantWorklogTurn(sessionId = "") {
        assistantWorklogCounter += 1;
        const el = document.createElement("article");
        el.className = "assistant-worklog";
        el.dataset.worklogId = `assistant-worklog-${assistantWorklogCounter}`;
        el.dataset.sessionId = String(sessionId || "").trim();

        const statusListEl = document.createElement("div");
        statusListEl.className = "worklog-status-list";

        const finalTextEl = document.createElement("div");
        finalTextEl.className = "worklog-final-text";

        el.appendChild(statusListEl);
        el.appendChild(finalTextEl);
        chatMessagesEl.appendChild(el);
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        return { el, statusListEl, finalTextEl, sessionId: el.dataset.sessionId, statusRefs: new Map() };
      }

      function ensureAssistantWorklogTurn(sessionId = "") {
        const normalizedSessionId = String(sessionId || activeThoughtSessionId || "").trim() || beginThoughtSession();
        if (
          currentAssistantWorklog &&
          currentAssistantWorklog.el &&
          currentAssistantWorklog.el.parentNode &&
          currentAssistantWorklog.sessionId === normalizedSessionId
        ) {
          return currentAssistantWorklog;
        }
        currentAssistantWorklog = buildAssistantWorklogTurn(normalizedSessionId);
        return currentAssistantWorklog;
      }

      function appendWorklogPhase(payload, sessionId = "") {
        const turn = ensureAssistantWorklogTurn(sessionId);
        const text = String(payload?.text || "").trim();
        if (!text) {
          return turn;
        }
        const source = String(payload?.source || "brain").trim();
        const statusId = String(payload?.status_id || payload?.phase || "").trim();
        const reusable = statusId && payload?.transient !== false ? turn.statusRefs.get(statusId) : null;
        const rowEl = reusable || document.createElement("div");
        rowEl.className = `worklog-status-row source-${source.replace(/[^a-z0-9_-]/gi, "-")}`;
        rowEl.dataset.statusId = statusId;

        const textEl = reusable?.querySelector(".worklog-status-text") || document.createElement("div");
        textEl.className = "worklog-status-text";
        textEl.textContent = text;

        const sourceEl = reusable?.querySelector(".worklog-status-source") || document.createElement("span");
        sourceEl.className = "worklog-status-source";
        sourceEl.textContent = sourceLabel(source);
        textEl.appendChild(sourceEl);

        if (!reusable) {
          rowEl.appendChild(textEl);
          turn.statusListEl.appendChild(rowEl);
          if (statusId) {
            turn.statusRefs.set(statusId, rowEl);
          }
        }
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        return turn;
      }

      function updateWorklogFinalText(turn, text, pending = false) {
        const target = turn || ensureAssistantWorklogTurn();
        if (!target || !target.finalTextEl) {
          return target;
        }
        target.finalTextEl.textContent = String(text || "");
        target.el.classList.toggle("pending", !!pending);
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        return target;
      }

      function appendAssistantHistoryBlock(item) {
        const previousWorklog = currentAssistantWorklog;
        const turn = buildAssistantWorklogTurn(`history-${assistantWorklogCounter + 1}`);
        updateWorklogFinalText(turn, String(item?.content || ""));
        currentAssistantWorklog = previousWorklog;
        return turn;
      }

      function findUserMessageById(messageId) {
        const targetId = String(messageId || "").trim();
        if (!targetId) {
          return null;
        }
        return Array.from(chatMessagesEl.querySelectorAll(".msg.user")).find((item) => item.dataset.chatMessageId === targetId) || null;
      }

      function clearPendingRetryEdit(restoreButton = true) {
        if (pendingRetryEdit?.messageId) {
          const previousEl = findUserMessageById(pendingRetryEdit.messageId);
          if (previousEl) {
            previousEl.classList.remove("is-edit-source");
          }
        }
        pendingRetryEdit = null;
        chatInputWrapEl.classList.remove("is-retry-editing");
        if (restoreButton) {
          chatSendEl.textContent = "发送";
          chatSendEl.title = "";
        }
      }

      function beginUserMessageEditRetry(messageId) {
        if (chatState !== "idle" && chatState !== "awaiting_followup_input") {
          return;
        }
        const messageEl = findUserMessageById(messageId);
        if (!messageEl) {
          return;
        }
        const bodyEl = messageEl.querySelector(".msg-body");
        const originalText = String(bodyEl?.textContent || messageEl.dataset.chatMessageText || "");
        clearPendingRetryEdit(false);
        messageEl.classList.add("is-edit-source");
        pendingRetryEdit = {
          messageId: String(messageId || ""),
          originalText,
          assistantTurn: Number(messageEl.dataset.assistantTurn || 0) || null,
        };
        chatInputEl.value = originalText;
        chatInputWrapEl.classList.add("is-retry-editing");
        chatSendEl.textContent = "重试";
        chatSendEl.title = "重新发送这条消息";
        chatInputEl.focus();
        const end = chatInputEl.value.length;
        chatInputEl.setSelectionRange(end, end);
      }

      function truncateChatAfterMessage(messageId) {
        const messageEl = findUserMessageById(messageId);
        if (!messageEl) {
          return { assistantTurn: null };
        }
        const assistantTurn = Number(messageEl.dataset.assistantTurn || 0) || null;
        let node = messageEl.nextElementSibling;
        while (node) {
          const next = node.nextElementSibling;
          node.remove();
          node = next;
        }
        messageEl.remove();
        currentThoughtGroup = null;
        currentAssistantWorklog = null;
        approvalBubbleRefs.clear();
        approvalThoughtSessionRefs.clear();
        hideHumanOpsClickPreview();
        activeApprovalId = "";
        pendingApprovalInputTurnId = "";
        return { assistantTurn };
      }

      function setChatState(next) {

      function stopSpeaking(manual = false) {

      function openChat() {
