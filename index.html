<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live2D Desktop Pet</title>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="./js/live2dcubismcore.min.js"></script>
  <script src="./js/live2d.min.js"></script>
  <script src="./js/pixi.min.js"></script>
  <script src="./js/index.min.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }

    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #window-frame {
      position: fixed;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      pointer-events: none;
      display: none;
      z-index: 9;
    }

    #status {
      position: fixed;
      left: 10px;
      top: 10px;
      z-index: 10;
      padding: 4px 8px;
      font-size: 11px;
      font-family: "Consolas", "Microsoft YaHei", sans-serif;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(0, 0, 0, 0.22);
      border-radius: 8px;
      pointer-events: none;
      white-space: pre;
      min-width: 180px;
      display: none;
    }

    #error {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 11;
      color: #ffd7d7;
      background: rgba(120, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 12px;
      max-width: calc(100vw - 20px);
      display: none;
      pointer-events: none;
    }

    #chat-toggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 13px;
      font-weight: 700;
      color: #7f3d59;
      background: linear-gradient(180deg, rgba(255, 247, 250, 0.95), rgba(255, 230, 240, 0.92));
      box-shadow: 0 14px 32px rgba(84, 45, 66, 0.28);
      cursor: pointer;
    }

    #chat-panel {
      position: fixed;
      left: 20px;
      top: 20px;
      width: min(420px, calc(100vw - 28px));
      height: min(620px, calc(100vh - 90px));
      z-index: 29;
      display: none;
      border-radius: 24px;
      background:
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.78), transparent 34%),
        linear-gradient(180deg, rgba(255, 248, 252, 0.98), rgba(252, 245, 248, 0.95));
      border: 1px solid rgba(255, 213, 229, 0.88);
      box-shadow:
        0 18px 42px rgba(126, 86, 106, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.82);
      overflow: hidden;
      color: #5c3f4a;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      min-width: 300px;
      min-height: 280px;
    }

    #chat-panel.open {
      display: grid;
      grid-template-rows: 56px 1fr auto;
    }

    #chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 700;
      color: #74475b;
      background: linear-gradient(180deg, rgba(255, 232, 242, 0.92), rgba(255, 244, 248, 0.9));
      border-bottom: 1px solid rgba(246, 203, 222, 0.9);
      cursor: move;
      user-select: none;
    }

    #chat-close {
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #8b4b67;
      cursor: pointer;
      font-size: 16px;
    }

    #chat-messages {
      overflow: auto;
      padding: 16px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 237, 244, 0.78), transparent 22%),
        linear-gradient(180deg, rgba(255, 251, 252, 0.96), rgba(247, 242, 244, 0.96));
    }

    .msg {
      max-width: 88%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: 0 10px 24px rgba(131, 93, 109, 0.12);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(180deg, rgba(255, 221, 236, 0.98), rgba(248, 195, 221, 0.94));
      color: #763a5b;
    }

    .msg.pet {
      align-self: flex-start;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 251, 248, 0.96));
      color: #5f4650;
    }

    .msg.pet.phase-thought {
      background: linear-gradient(180deg, rgba(255, 248, 231, 0.98), rgba(255, 238, 201, 0.96));
    }

    .msg.pet.phase-action {
      background: linear-gradient(180deg, rgba(233, 249, 255, 0.98), rgba(214, 240, 252, 0.96));
    }

    .msg.pet.phase-done {
      background: linear-gradient(180deg, rgba(252, 255, 252, 0.98), rgba(239, 249, 242, 0.96));
    }

    .msg.pending {
      opacity: 0.78;
      border-style: dashed;
    }

    .msg.error {
      align-self: center;
      background: linear-gradient(180deg, rgba(255, 234, 234, 0.98), rgba(255, 210, 210, 0.96));
      color: #8c3644;
    }

    .msg-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
    }

    .speaker-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #7a4a5f;
      font-weight: 700;
    }

    .phase-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 62px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: rgba(255, 255, 255, 0.8);
      color: #86586a;
    }

    .msg-body {
      font-size: 13px;
      line-height: 1.6;
    }

    .tool-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tool-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      color: #6f5260;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.78);
    }

    .approval-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    .approval-btn {
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: #6a4654;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 8px 16px rgba(123, 92, 108, 0.12);
    }

    .approval-btn.approve {
      background: linear-gradient(180deg, rgba(215, 255, 233, 0.98), rgba(190, 245, 216, 0.96));
      color: #306f50;
    }

    .approval-btn.reject {
      background: linear-gradient(180deg, rgba(255, 240, 245, 0.98), rgba(255, 220, 232, 0.96));
      color: #8a4c68;
    }

    .approval-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .approval-status {
      font-size: 12px;
      color: #765260;
    }

    #chat-input-wrap {
      border-top: 1px solid rgba(246, 203, 222, 0.9);
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      background: linear-gradient(180deg, rgba(255, 247, 250, 0.96), rgba(255, 240, 246, 0.94));
    }

    #chat-input {
      min-height: 70px;
      max-height: 200px;
      resize: vertical;
      border-radius: 18px;
      border: 1px solid rgba(238, 203, 221, 0.98);
      outline: none;
      background: rgba(255, 255, 255, 0.82);
      color: #684a58;
      padding: 12px 14px;
      font-size: 13px;
      font-family: inherit;
    }

    #chat-send,
    #chat-stop {
      align-self: end;
      border: none;
      border-radius: 999px;
      color: #744b5e;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 10px 18px rgba(124, 95, 111, 0.15);
    }

    #chat-send {
      background: linear-gradient(180deg, rgba(255, 226, 240, 0.98), rgba(250, 201, 223, 0.96));
    }

    #chat-stop {
      background: linear-gradient(180deg, rgba(240, 252, 247, 0.98), rgba(217, 244, 232, 0.96));
    }

    .chat-resizer-handle {
      position: absolute;
      z-index: 4;
      user-select: none;
    }

    .chat-resizer-right {
      top: 60px;
      right: 0;
      width: 10px;
      height: calc(100% - 70px);
      cursor: ew-resize;
    }

    .chat-resizer-bottom {
      left: 18px;
      bottom: 0;
      width: calc(100% - 36px);
      height: 10px;
      cursor: ns-resize;
    }

    .chat-resizer-corner {
      right: 0;
      bottom: 0;
      width: 22px;
      height: 22px;
      cursor: nwse-resize;
    }

    .chat-resizer-corner::before {
      content: "";
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 12px;
      height: 12px;
      border-right: 2px solid rgba(181, 129, 151, 0.62);
      border-bottom: 2px solid rgba(181, 129, 151, 0.62);
      border-radius: 0 0 10px 0;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="window-frame"></div>
  <div id="status">loading...</div>
  <div id="error"></div>
  <button id="chat-toggle">Chat</button>
  <div id="chat-panel">
    <div id="chat-header">
      <span id="chat-title">桌宠对话</span>
      <button id="chat-close">×</button>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-wrap">
      <textarea id="chat-input" placeholder="输入消息，Enter发送，Shift+Enter换行"></textarea>
      <button id="chat-send">发送</button>
      <button id="chat-stop">停止语音</button>
    </div>
    <div id="chat-resizer-right" class="chat-resizer-handle chat-resizer-right"></div>
    <div id="chat-resizer-bottom" class="chat-resizer-handle chat-resizer-bottom"></div>
    <div id="chat-resizer-corner" class="chat-resizer-handle chat-resizer-corner"></div>
  </div>

  <script>
    (() => {
      const MIN_SCALE = 0.05;
      const MAX_SCALE = 5.0;

      const state = {
        model_url: "",
        scale: 0.3,
        offset_x: 0,
        offset_y: 40,
        rotation: 0,
        opacity: 1,
        edit_mode: false,
        follow_mouse: true,
        chat: {
          backend_url: "http://127.0.0.1:8008",
          llm_provider: "ollama",
          api_base_url: "http://127.0.0.1:11434",
          api_key: "",
          model: "qwen3:8b",
          session_id: "default",
          memory_window: 10,
          voice: "zh-CN-XiaoxiaoNeural",
          rate_pct: 0,
          tts_provider: "edge_tts",
          tts_provider_url: "",
          expression_mode: true,
          expression_output_format: "ndjson_v1",
          react_enabled: true,
          react_visibility: "inline",
          max_reasoning_steps: 10,
          available_expressions: [],
          lip_sync_gain: 1,
          mouth_parameter_ids: [],
          mouth_form_parameter_ids: [],
          tooling: {
            enabled: true,
            mode: "mcp_local_phase2",
          },
          system_prompt: "",
          pet_display_name: "机魂",
        },
      };
      const DEFAULT_MOUTH_OPEN_PARAMETER_IDS = ["ParamMouthOpenY", "PARAM_MOUTH_OPEN_Y", "ParamMouthOpenX", "LipSync"];
      const DEFAULT_MOUTH_FORM_PARAMETER_IDS = ["ParamMouthForm", "PARAM_MOUTH_FORM"];

      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");
      const canvas = document.getElementById("canvas");
      const frameEl = document.getElementById("window-frame");
      const chatToggleEl = document.getElementById("chat-toggle");
      const chatPanelEl = document.getElementById("chat-panel");
      const chatCloseEl = document.getElementById("chat-close");
      const chatMessagesEl = document.getElementById("chat-messages");
      const chatInputEl = document.getElementById("chat-input");
      const chatSendEl = document.getElementById("chat-send");
      const chatStopEl = document.getElementById("chat-stop");
      const chatHeaderEl = document.getElementById("chat-header");
      const chatTitleEl = document.getElementById("chat-title");
      const chatResizerRightEl = document.getElementById("chat-resizer-right");
      const chatResizerBottomEl = document.getElementById("chat-resizer-bottom");
      const chatResizerCornerEl = document.getElementById("chat-resizer-corner");

      let app = null;
      let model = null;
      let qtBridge = null;
      let pendingConfig = null;
      let pendingModelUrl = "";
      let chatState = "idle";
      let activeAudio = null;
      let audioCtx = null;
      let analyser = null;
      let mediaSource = null;
      let lipsyncRAF = 0;
      let ttsQueue = [];
      let ttsPlaying = false;
      let streamFinished = false;
      let pendingSpeakBuffer = "";
      let speakFlushTimer = 0;
      let receivedStructuredSegment = false;
      let chatPanelPositioned = false;
      let chatDragging = false;
      let chatResizing = false;
      let chatResizeMode = "";
      let dragStartX = 0;
      let dragStartY = 0;
      let panelStartLeft = 0;
      let panelStartTop = 0;
      let panelStartW = 0;
      let panelStartH = 0;
      let activeApprovalId = "";

      let dragging = false;
      let dragDx = 0;
      let dragDy = 0;
      let notifyTimer = null;

      function showError(msg) {
        errorEl.textContent = String(msg || "unknown error");
        errorEl.style.display = "block";
      }

      function clearError() {
        errorEl.style.display = "none";
        errorEl.textContent = "";
      }

      function logToQt(msg) {
        if (qtBridge && typeof qtBridge.log === "function") {
          qtBridge.log(String(msg));
        } else {
          console.log(msg);
        }
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function toRateString(ratePct) {
        let n = Number(ratePct);
        if (!Number.isFinite(n)) {
          n = 0;
        }
        n = Math.round(clamp(n, -50, 100));
        return `${n >= 0 ? "+" : ""}${n}%`;
      }

      function roundInt(value) {
        return Math.round(Number(value) || 0);
      }

      function refreshStatus() {
        frameEl.style.display = state.edit_mode ? "block" : "none";
        statusEl.style.display = state.edit_mode ? "block" : "none";
        const modelName = state.model_url ? state.model_url.split("/").pop() : "(none)";
        statusEl.textContent = [
          `model: ${modelName}`,
          `edit: ${state.edit_mode ? "on" : "off"}`,
          `scale: ${state.scale.toFixed(2)}`,
          `offset: (${roundInt(state.offset_x)}, ${roundInt(state.offset_y)})`,
        ].join("\n");
      }

      function loadChatPanelState() {
        try {
          const raw = window.localStorage.getItem("desktopPet.chatPanel");
          if (!raw) {
            return null;
          }
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : null;
        } catch (_) {
          return null;
        }
      }

      function saveChatPanelState() {
        if (!chatPanelPositioned) {
          return;
        }
        const payload = {
          left: chatPanelEl.offsetLeft,
          top: chatPanelEl.offsetTop,
          width: chatPanelEl.offsetWidth,
          height: chatPanelEl.offsetHeight,
        };
        try {
          window.localStorage.setItem("desktopPet.chatPanel", JSON.stringify(payload));
        } catch (_) {}
      }

      function parsePetNameFromPrompt(raw) {
        const text = String(raw || "").trim();
        if (!text) {
          return "";
        }
        try {
          const data = JSON.parse(text);
          const character = data && typeof data === "object" ? data.character : null;
          if (character && typeof character === "object") {
            if (character.name_cn) {
              return String(character.name_cn).trim();
            }
            if (character.name) {
              return String(character.name).trim();
            }
          }
          if (data && typeof data === "object" && data.name) {
            return String(data.name).trim();
          }
        } catch (_) {}
        return "";
      }

      function syncPetDisplayName() {
        const parsed = parsePetNameFromPrompt(state.chat?.system_prompt || "");
        const next = String(state.chat?.pet_display_name || parsed || "桌宠").trim() || "桌宠";
        state.chat.pet_display_name = next;
        chatTitleEl.textContent = `${next}对话`;
      }

      function speakerNameForRole(role) {
        return role === "user" ? "你" : String(state.chat?.pet_display_name || "桌宠");
      }

      function phaseLabel(phase) {
        const value = String(phase || "").trim().toLowerCase();
        if (value === "thought") {
          return "思考中";
        }
        if (value === "action") {
          return "行动中";
        }
        if (value === "done") {
          return "已完成";
        }
        return "";
      }

      function appendMessage(role, text, options = {}) {
        const phase = String(options.phase || "").trim().toLowerCase();
        const el = document.createElement("article");
        const roleClass = role === "user" ? "user" : role === "error" ? "error" : "pet";
        el.className = `msg ${roleClass}${phase ? ` phase-${phase}` : ""}${options.pending ? " pending" : ""}`;

        const headEl = document.createElement("div");
        headEl.className = "msg-head";

        const speakerEl = document.createElement("div");
        speakerEl.className = "speaker-pill";
        speakerEl.textContent = String(options.speakerName || speakerNameForRole(role));

        headEl.appendChild(speakerEl);
        if (phase) {
          const phaseEl = document.createElement("div");
          phaseEl.className = "phase-pill";
          phaseEl.textContent = phaseLabel(phase);
          headEl.appendChild(phaseEl);
        }

        const bodyEl = document.createElement("div");
        bodyEl.className = "msg-body";
        bodyEl.textContent = String(text || "");

        el.appendChild(headEl);
        el.appendChild(bodyEl);
        chatMessagesEl.appendChild(el);
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
        return { el, bodyEl };
      }

      function updateMessageText(messageRef, text, pending = false) {
        if (!messageRef || !messageRef.bodyEl) {
          return;
        }
        messageRef.bodyEl.textContent = String(text || "");
        messageRef.el.classList.toggle("pending", !!pending);
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
      }

      function appendToolList(targetEl, tools) {
        if (!targetEl || !Array.isArray(tools) || !tools.length) {
          return;
        }
        const listEl = document.createElement("div");
        listEl.className = "tool-list";
        for (const item of tools) {
          const chipEl = document.createElement("div");
          chipEl.className = "tool-chip";
          chipEl.textContent = String(item.summary || item.name || "");
          listEl.appendChild(chipEl);
        }
        targetEl.appendChild(listEl);
      }

      function setChatState(next) {
        chatState = next;
        chatSendEl.disabled = next !== "idle";
        chatInputEl.disabled = next === "streaming";
      }

      function stopSpeaking(manual = false) {
        if (speakFlushTimer) {
          clearTimeout(speakFlushTimer);
          speakFlushTimer = 0;
        }
        ttsQueue = [];
        pendingSpeakBuffer = "";
        ttsPlaying = false;
        streamFinished = true;
        if (activeAudio) {
          try {
            activeAudio.pause();
            activeAudio.currentTime = 0;
          } catch (_) {}
        }
        try {
          if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
          }
        } catch (_) {}
        stopLipSyncLoop();
        setChatState("idle");
        if (manual) {
          appendMessage("error", "语音已停止");
        }
      }

      function openChat() {
        if (!chatPanelPositioned) {
          const saved = loadChatPanelState();
          const w = Math.min(
            Math.max(saved?.width || Math.floor(window.innerWidth * 0.42), 300),
            Math.max(300, window.innerWidth - 12),
          );
          const h = Math.min(
            Math.max(saved?.height || Math.floor(window.innerHeight * 0.6), 280),
            Math.max(280, window.innerHeight - 12),
          );
          const left = Math.min(
            Math.max(saved?.left ?? window.innerWidth - w - 24, 8),
            Math.max(8, window.innerWidth - w - 8),
          );
          const top = Math.min(
            Math.max(saved?.top ?? window.innerHeight - h - 68, 8),
            Math.max(8, window.innerHeight - h - 8),
          );
          chatPanelEl.style.width = `${w}px`;
          chatPanelEl.style.height = `${h}px`;
          chatPanelEl.style.left = `${left}px`;
          chatPanelEl.style.top = `${top}px`;
          chatPanelPositioned = true;
        }
        chatPanelEl.classList.add("open");
        chatInputEl.focus();
      }

      function closeChat() {
        chatPanelEl.classList.remove("open");
        saveChatPanelState();
      }

      function scheduleNotifyState() {
        if (notifyTimer) {
          return;
        }
        notifyTimer = setTimeout(() => {
          notifyTimer = null;
          notifyStateNow();
        }, 80);
      }

      function notifyStateNow() {
        if (!qtBridge || typeof qtBridge.petStateChanged !== "function") {
          return;
        }

        const payload = {
          scale: state.scale,
          offset_x: roundInt(state.offset_x),
          offset_y: roundInt(state.offset_y),
          rotation: state.rotation,
          opacity: state.opacity,
        };

        qtBridge.petStateChanged(JSON.stringify(payload));
      }

      function setMouthOpen(value) {
        if (!model || !model.internalModel || !model.internalModel.coreModel) {
          return;
        }
        const core = model.internalModel.coreModel;
        const v = clamp(Number(value) || 0, 0, 1);
        const openIds = Array.isArray(state.chat?.mouth_parameter_ids) && state.chat.mouth_parameter_ids.length
          ? state.chat.mouth_parameter_ids
          : DEFAULT_MOUTH_OPEN_PARAMETER_IDS;
        const formIds = Array.isArray(state.chat?.mouth_form_parameter_ids) && state.chat.mouth_form_parameter_ids.length
          ? state.chat.mouth_form_parameter_ids
          : DEFAULT_MOUTH_FORM_PARAMETER_IDS;
        for (const parameterId of openIds) {
          try {
            if (typeof core.setParameterValueById === "function") {
              core.setParameterValueById(parameterId, v, 0.8);
            } else if (typeof core.addParameterValueById === "function") {
              core.addParameterValueById(parameterId, v * 0.65, 0.8);
            }
          } catch (_) {
            // ignore missing mouth parameters
          }
        }
        for (const parameterId of formIds) {
          try {
            if (typeof core.setParameterValueById === "function") {
              core.setParameterValueById(parameterId, (v - 0.5) * 0.35, 0.35);
            } else if (typeof core.addParameterValueById === "function") {
              core.addParameterValueById(parameterId, (v - 0.5) * 0.15, 0.35);
            }
          } catch (_) {
            // ignore missing mouth form parameters
          }
        }
      }

      function resolveExpressionName(name) {
        const expr = String(name || "").trim();
        if (!expr) {
          return "";
        }
        const available = Array.isArray(state.chat?.available_expressions) ? state.chat.available_expressions : [];
        if (!available.length) {
          return expr;
        }
        if (available.includes(expr)) {
          return expr;
        }
        const normalized = expr.toLowerCase().replace(/[\s_-]+/g, "");
        const fallback = available.find((item) => String(item).toLowerCase().replace(/[\s_-]+/g, "") === normalized);
        return fallback || "";
      }

      function triggerExpressionSafe(name) {
        const expr = resolveExpressionName(name);
        if (!expr || !model || typeof model.expression !== "function") {
          return;
        }
        try {
          model.expression(expr);
        } catch (_) {
          // ignore missing/invalid expression
        }
      }

      function stopLipSyncLoop() {
        if (lipsyncRAF) {
          cancelAnimationFrame(lipsyncRAF);
          lipsyncRAF = 0;
        }
        setMouthOpen(0);
      }

      function startLipSync(audioEl) {
        try {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === "suspended") {
            audioCtx.resume().catch(() => {});
          }
          if (mediaSource) {
            try {
              mediaSource.disconnect();
            } catch (_) {}
            mediaSource = null;
          }
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          mediaSource = audioCtx.createMediaElementSource(audioEl);
          mediaSource.connect(analyser);
          analyser.connect(audioCtx.destination);
        } catch (_) {
          return;
        }

        const data = new Uint8Array(analyser.fftSize);
        const tick = () => {
          if (!analyser || audioEl.paused || audioEl.ended) {
            stopLipSyncLoop();
            return;
          }
          analyser.getByteTimeDomainData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) {
            const n = (data[i] - 128) / 128;
            sum += n * n;
          }
          const rms = Math.sqrt(sum / data.length);
          const lipSyncGain = Math.max(0.5, Number(state.chat?.lip_sync_gain || 1));
          const mouth = clamp(rms * (4.8 + lipSyncGain * 1.8), 0, 1);
          setMouthOpen(mouth);
          lipsyncRAF = requestAnimationFrame(tick);
        };
        tick();
      }

      function fallbackSpeakByBrowser(text) {
        const synth = window.speechSynthesis;
        if (!synth || !window.SpeechSynthesisUtterance) {
          return Promise.resolve();
        }
        return new Promise((resolve) => {
          try {
          synth.cancel();
          const utt = new SpeechSynthesisUtterance(text);
          utt.lang = "zh-CN";
          utt.rate = 1.0;
          utt.onstart = () => {
            let v = 0;
            const tick = () => {
              if (synth.speaking) {
                v = v > 0.4 ? 0.08 : 0.72;
                setMouthOpen(v);
                lipsyncRAF = requestAnimationFrame(tick);
              } else {
                stopLipSyncLoop();
              }
            };
            tick();
          };
          utt.onend = () => {
            stopLipSyncLoop();
            resolve();
          };
          utt.onerror = () => {
            stopLipSyncLoop();
            resolve();
          };
          synth.speak(utt);
          } catch (_) {
            stopLipSyncLoop();
            resolve();
          }
        });
      }

      function enqueueTTSChunk(text, expr = null) {
        const chunk = (text || "").trim();
        if (!chunk) {
          return;
        }
        ttsQueue.push({ text: chunk, expr: expr ? String(expr).trim() : null });
        if (!ttsPlaying) {
          playNextTTSChunk().catch(() => {});
        }
      }

      function feedSpeakBuffer(delta, force = false) {
        pendingSpeakBuffer += delta || "";
        const punct = /[。！？!?；;\n]/;

        while (true) {
          const m = pendingSpeakBuffer.match(punct);
          if (!m || m.index === undefined) {
            break;
          }
          const end = m.index + 1;
          const chunk = pendingSpeakBuffer.slice(0, end);
          pendingSpeakBuffer = pendingSpeakBuffer.slice(end);
          enqueueTTSChunk(chunk, null);
        }

        if (!force && pendingSpeakBuffer.length >= 20 && ttsQueue.length <= 1 && !ttsPlaying) {
          const chunk = pendingSpeakBuffer.slice(0, 20);
          pendingSpeakBuffer = pendingSpeakBuffer.slice(20);
          enqueueTTSChunk(chunk, null);
        }

        if (!force) {
          if (speakFlushTimer) {
            clearTimeout(speakFlushTimer);
          }
          speakFlushTimer = setTimeout(() => {
            speakFlushTimer = 0;
            if (pendingSpeakBuffer.trim()) {
              const chunk = pendingSpeakBuffer;
              pendingSpeakBuffer = "";
              enqueueTTSChunk(chunk, null);
            }
          }, 120);
        }

        if (force && pendingSpeakBuffer.trim()) {
          enqueueTTSChunk(pendingSpeakBuffer, null);
          pendingSpeakBuffer = "";
        }
      }

      async function playNextTTSChunk() {
        if (ttsPlaying) {
          return;
        }
        const nextItem = ttsQueue.shift();
        if (!nextItem) {
          if (streamFinished) {
            setChatState("idle");
          }
          return;
        }
        const nextText = String(nextItem.text || "").trim();
        const nextExpr = String(nextItem.expr || "").trim();
        if (!nextText) {
          if (streamFinished && ttsQueue.length === 0) {
            setChatState("idle");
          }
          return;
        }

        const backend = (state.chat?.backend_url || "").replace(/\/$/, "");
        if (!backend) {
          if (streamFinished && ttsQueue.length === 0) {
            setChatState("idle");
          }
          return;
        }
        ttsPlaying = true;
        setChatState("tts");
        if (state.chat.expression_mode && nextExpr) {
          triggerExpressionSafe(nextExpr);
        }

        try {
          const resp = await fetch(`${backend}/api/tts`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: nextText,
              voice: state.chat.voice || "zh-CN-XiaoxiaoNeural",
              rate: toRateString(state.chat.rate_pct),
              volume: "+0%",
              provider: state.chat.tts_provider || "edge_tts",
              provider_url: state.chat.tts_provider_url || "",
            }),
          });
          if (!resp.ok) {
            let detail = `HTTP ${resp.status}`;
            try {
              const errData = await resp.json();
              detail = errData?.detail || detail;
            } catch (_) {}
            appendMessage("error", `TTS失败: ${detail}`);
            showError(`TTS失败: ${detail}`);
            await fallbackSpeakByBrowser(nextText);
            ttsPlaying = false;
            await playNextTTSChunk();
            return;
          }

          const data = await resp.json();
          if (!data || !data.audio_url) {
            appendMessage("error", "TTS失败: 后端未返回 audio_url");
            showError("TTS失败: 后端未返回 audio_url");
            await fallbackSpeakByBrowser(nextText);
            ttsPlaying = false;
            await playNextTTSChunk();
            return;
          }

          const audioResp = await fetch(`${backend}${data.audio_url}`);
          if (!audioResp.ok) {
            appendMessage("error", `音频下载失败: HTTP ${audioResp.status}`);
            showError(`音频下载失败: HTTP ${audioResp.status}`);
            await fallbackSpeakByBrowser(nextText);
            ttsPlaying = false;
            await playNextTTSChunk();
            return;
          }

          const audioBlob = await audioResp.blob();
          const blobUrl = URL.createObjectURL(audioBlob);

          if (activeAudio) {
            try {
              activeAudio.pause();
            } catch (_) {}
          }
          activeAudio = new Audio(blobUrl);
          activeAudio.preload = "auto";

          await new Promise((resolve, reject) => {
            activeAudio.addEventListener(
              "ended",
              () => {
                stopLipSyncLoop();
                URL.revokeObjectURL(blobUrl);
                resolve();
              },
              { once: true },
            );
            activeAudio.addEventListener(
              "error",
              () => {
                stopLipSyncLoop();
                URL.revokeObjectURL(blobUrl);
                reject(new Error("audio playback error"));
              },
              { once: true },
            );
            setChatState("speaking");
            activeAudio
              .play()
              .then(() => startLipSync(activeAudio))
              .catch(reject);
          });
        } catch (err) {
          appendMessage("error", `音频播放失败，已切换浏览器语音: ${err?.message || err}`);
          showError(`音频播放失败: ${err?.message || err}`);
          await fallbackSpeakByBrowser(nextText);
          stopLipSyncLoop();
        }

        ttsPlaying = false;
        await playNextTTSChunk();
      }

      function appendApprovalBubble(payload) {
        const message = appendMessage("pet", String(payload.text || ""), {
          phase: "action",
          speakerName: speakerNameForRole("pet"),
        });
        appendToolList(message.el, Array.isArray(payload.tools) ? payload.tools : []);

        const actionWrap = document.createElement("div");
        actionWrap.className = "approval-actions";

        const approveBtn = document.createElement("button");
        approveBtn.className = "approval-btn approve";
        approveBtn.textContent = "批准";

        const rejectBtn = document.createElement("button");
        rejectBtn.className = "approval-btn reject";
        rejectBtn.textContent = "取消";

        const statusEl = document.createElement("div");
        statusEl.className = "approval-status";

        actionWrap.appendChild(approveBtn);
        actionWrap.appendChild(rejectBtn);
        message.el.appendChild(actionWrap);
        message.el.appendChild(statusEl);

        const setResolved = (text) => {
          approveBtn.disabled = true;
          rejectBtn.disabled = true;
          statusEl.textContent = text;
        };

        approveBtn.addEventListener("click", async () => {
          if (!payload.turn_id || activeApprovalId) {
            return;
          }
          activeApprovalId = String(payload.turn_id);
          appendMessage("user", "好，去做吧。", { speakerName: "你" });
          setResolved("已批准，正在处理。");
          await continueApproval(payload.turn_id, true);
        });

        rejectBtn.addEventListener("click", async () => {
          if (!payload.turn_id || activeApprovalId) {
            return;
          }
          activeApprovalId = String(payload.turn_id);
          appendMessage("user", "这次先不要调用工具。", { speakerName: "你" });
          setResolved("已取消工具调用，正在改为直接回答。");
          await continueApproval(payload.turn_id, false);
        });

        return message;
      }

      async function consumeChatStream(resp) {
        if (!resp.ok || !resp.body) {
          throw new Error(`chat http ${resp.status}`);
        }

        const decoder = new TextDecoder();
        const reader = resp.body.getReader();
        let buffer = "";
        let finalMsg = null;
        let full = "";
        let awaitingApproval = false;
        let receivedDisplaySegment = false;
        let pendingThought = appendMessage("pet", "少女整理思绪中...", {
          phase: "thought",
          speakerName: speakerNameForRole("pet"),
          pending: true,
        });
        receivedStructuredSegment = false;

        const ensureFinalMessage = () => {
          if (!finalMsg) {
            finalMsg = appendMessage("pet", "", {
              phase: "done",
              speakerName: speakerNameForRole("pet"),
            });
          }
          return finalMsg;
        };

        const finishPendingThought = (text) => {
          if (!pendingThought) {
            return null;
          }
          updateMessageText(pendingThought, text, false);
          const current = pendingThought;
          pendingThought = null;
          return current;
        };

        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            break;
          }
          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";

          for (const raw of chunks) {
            const lines = raw.split("\n");
            let eventName = "";
            let dataText = "";
            for (const line of lines) {
              if (line.startsWith("event:")) {
                eventName = line.slice(6).trim();
              } else if (line.startsWith("data:")) {
                dataText += line.slice(5).trim();
              }
            }
            if (!eventName || !dataText) {
              continue;
            }
            const payload = JSON.parse(dataText);
            if (eventName === "meta") {
              if (payload.pet_display_name) {
                state.chat.pet_display_name = String(payload.pet_display_name);
                syncPetDisplayName();
              }
            } else if (eventName === "phase") {
              const phase = String(payload.phase || "");
              const text = String(payload.text || "");
              if (phase === "thought" && pendingThought) {
                finishPendingThought(text || "我先整理了一下思路。");
              } else {
                appendMessage("pet", text, {
                  phase,
                  speakerName: speakerNameForRole("pet"),
                });
              }
            } else if (eventName === "approval_required") {
              awaitingApproval = true;
              if (pendingThought) {
                finishPendingThought("我先整理好了接下来的计划。");
              }
              appendApprovalBubble(payload);
            } else if (eventName === "segment") {
              if (pendingThought) {
                pendingThought.el.remove();
                pendingThought = null;
              }
              receivedStructuredSegment = true;
              const segText = String(payload.text || "");
              const segExpr = payload.expr == null ? null : String(payload.expr || "");
              if (segText) {
                enqueueTTSChunk(segText, segExpr);
              }
            } else if (eventName === "display_segment") {
              if (pendingThought) {
                pendingThought.el.remove();
                pendingThought = null;
              }
              receivedDisplaySegment = true;
              full += String(payload.text || "");
              updateMessageText(ensureFinalMessage(), full || "少女思考中...");
            } else if (eventName === "token") {
              if (receivedStructuredSegment) {
                continue;
              }
              if (pendingThought) {
                pendingThought.el.remove();
                pendingThought = null;
              }
              full += payload.delta || "";
              updateMessageText(ensureFinalMessage(), full || "少女思考中...");
              feedSpeakBuffer(payload.delta || "");
            } else if (eventName === "done") {
              full = payload.text || full;
              if (pendingThought) {
                pendingThought.el.remove();
                pendingThought = null;
              }
              if (receivedStructuredSegment && !receivedDisplaySegment && !full) {
                full = "(语音输出已完成)";
              }
              updateMessageText(ensureFinalMessage(), full || "(空响应)");
            } else if (eventName === "error") {
              throw new Error(payload.message || "chat stream error");
            }
          }
        }

        if (pendingThought && !awaitingApproval) {
          pendingThought.el.remove();
        }
        return { full, awaitingApproval };
      }

      async function continueApproval(turnId, approved) {
        const backend = (state.chat?.backend_url || "").replace(/\/$/, "");
        if (!backend) {
          appendMessage("error", "后端地址未配置");
          return;
        }
        stopSpeaking(false);
        setChatState("streaming");
        streamFinished = false;
        receivedStructuredSegment = false;
        pendingSpeakBuffer = "";
        ttsQueue = [];
        ttsPlaying = false;
        try {
          const resp = await fetch(`${backend}/api/chat/approval`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ turn_id: turnId, approved: !!approved }),
          });
          const result = await consumeChatStream(resp);
          if (result.awaitingApproval) {
            setChatState("awaiting_approval");
            return;
          }
          if (!result.awaitingApproval) {
            streamFinished = true;
            if (!receivedStructuredSegment) {
              feedSpeakBuffer("", true);
            }
            if (!ttsPlaying && ttsQueue.length === 0) {
              setChatState("idle");
            }
          }
        } catch (err) {
          appendMessage("error", `对话失败: ${err?.message || String(err)}`, {
            speakerName: "系统",
          });
          setChatState("idle");
        } finally {
          activeApprovalId = "";
          if (chatState !== "awaiting_approval" && chatState !== "idle" && !ttsPlaying) {
            setChatState("idle");
          }
        }
      }

      async function streamChat(text) {
        const backend = (state.chat?.backend_url || "").replace(/\/$/, "");
        if (!backend) {
          appendMessage("error", "后端地址未配置", { speakerName: "系统" });
          return;
        }
        const userText = text.trim();
        if (!userText) {
          return;
        }
        appendMessage("user", userText, { speakerName: "你" });
        stopSpeaking(false);
        setChatState("streaming");
        streamFinished = false;
        receivedStructuredSegment = false;
        pendingSpeakBuffer = "";
        ttsQueue = [];
        ttsPlaying = false;
        activeApprovalId = "";

        try {
          const resp = await fetch(`${backend}/api/chat/stream`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session_id: state.chat.session_id || "default",
              model: state.chat.model || "qwen3:8b",
              memory_window: Number(state.chat.memory_window || 10),
              system_prompt: state.chat.system_prompt || "",
              expression_mode: !!state.chat.expression_mode,
              expression_output_format: state.chat.expression_output_format || "ndjson_v1",
              available_expressions: Array.isArray(state.chat.available_expressions)
                ? state.chat.available_expressions
                : [],
              tools_enabled: !!(state.chat.tooling && state.chat.tooling.enabled),
              tool_mode: (state.chat.tooling && state.chat.tooling.mode) || "mcp_local_phase2",
              react_enabled: state.chat.react_enabled !== false,
              react_visibility: state.chat.react_visibility || "inline",
              max_reasoning_steps: Number(state.chat.max_reasoning_steps || 10),
              llm_provider: state.chat.llm_provider || "ollama",
              api_base_url: state.chat.api_base_url || "",
              api_key: state.chat.api_key || "",
              text: userText,
            }),
          });

          const result = await consumeChatStream(resp);
          if (result.awaitingApproval) {
            setChatState("awaiting_approval");
            return;
          }
        } catch (err) {
          appendMessage("error", `对话失败: ${err?.message || String(err)}`, {
            speakerName: "系统",
          });
          setChatState("idle");
          return;
        }

        streamFinished = true;
        if (!receivedStructuredSegment) {
          feedSpeakBuffer("", true);
        }
        if (!ttsPlaying && ttsQueue.length === 0) {
          setChatState("idle");
        }
      }

      function applyModelTransform() {
        if (!app || !model) {
          refreshStatus();
          return;
        }

        state.scale = clamp(Number(state.scale) || 0.3, MIN_SCALE, MAX_SCALE);
        state.opacity = clamp(Number(state.opacity) || 1, 0.1, 1);
        state.rotation = Number(state.rotation) || 0;

        model.scale.set(state.scale);
        model.alpha = state.opacity;
        model.rotation = (state.rotation * Math.PI) / 180;

        // Keep the model inside the window by default: bottom-center layout.
        const scaledWidth = model.width;
        const scaledHeight = model.height;
        const baseX = (app.renderer.width - scaledWidth) * 0.5;
        const baseY = app.renderer.height - scaledHeight;

        model.x = baseX + (Number(state.offset_x) || 0);
        model.y = baseY + (Number(state.offset_y) || 0);

        refreshStatus();
      }

      function bindModelInteraction() {
        if (!app || !model) {
          return;
        }

        model.interactive = true;
        if ("eventMode" in model) {
          model.eventMode = "static";
        }
        model.cursor = "pointer";

        model.on("pointerdown", (event) => {
          if (!state.edit_mode) {
            return;
          }
          dragging = true;
          const p = event?.data?.global;
          if (p) {
            dragDx = model.x - p.x;
            dragDy = model.y - p.y;
          }
        });

        model.on("pointertap", () => {
          playMotionCompat("Tap", 0);
        });

        model.on("hit", (hitAreas) => {
          if (!Array.isArray(hitAreas) || hitAreas.length === 0) {
            return;
          }
          const hasBody = hitAreas.some((v) => String(v).toLowerCase().includes("body"));
          const group = hasBody ? "Tap@Body" : "Tap";
          playMotionCompat(group, 0);
        });
      }

      function setupStageInteraction() {
        if (!app) {
          return;
        }

        app.stage.interactive = true;
        if ("eventMode" in app.stage) {
          app.stage.eventMode = "static";
        }
        app.stage.hitArea = app.screen;

        app.stage.on("pointerup", () => {
          if (dragging) {
            dragging = false;
            notifyStateNow();
          }
        });

        app.stage.on("pointerupoutside", () => {
          if (dragging) {
            dragging = false;
            notifyStateNow();
          }
        });

        app.stage.on("pointermove", (event) => {
          if (!dragging || !state.edit_mode || !model) {
            return;
          }

          const p = event?.data?.global;
          if (!p) {
            return;
          }

          model.x = p.x + dragDx;
          model.y = p.y + dragDy;

          const scaledWidth = model.width;
          const scaledHeight = model.height;
          const baseX = (app.renderer.width - scaledWidth) * 0.5;
          const baseY = app.renderer.height - scaledHeight;
          state.offset_x = roundInt(model.x - baseX);
          state.offset_y = roundInt(model.y - baseY);

          refreshStatus();
          scheduleNotifyState();
        });

        window.addEventListener(
          "wheel",
          (event) => {
            if (!state.edit_mode || !model) {
              return;
            }

            event.preventDefault();
            const zoomIn = event.deltaY < 0;
            const factor = zoomIn ? 1.05 : 0.95;
            state.scale = clamp(state.scale * factor, MIN_SCALE, MAX_SCALE);
            applyModelTransform();
            scheduleNotifyState();
          },
          { passive: false }
        );
      }

      function isRendererReady() {
        return !!(app && app.renderer && app.stage);
      }

      function playMotionCompat(group, index = 0) {
        if (!model) {
          return false;
        }

        if (typeof model.motion === "function") {
          try {
            model.motion(group, index);
            return true;
          } catch (_) {
            // fall through to internal manager
          }
        }

        const manager = model.internalModel?.motionManager;
        if (manager && typeof manager.startMotion === "function") {
          try {
            manager.startMotion(group, index);
            return true;
          } catch (_) {
            // ignore manager errors
          }
        }

        return false;
      }

      async function loadModel(url) {
        if (!url) {
          return;
        }

        if (!window.PIXI || !window.PIXI.live2d || !window.PIXI.live2d.Live2DModel) {
          throw new Error("PIXI.live2d.Live2DModel is unavailable. Check JS library files.");
        }

        clearError();

        if (!isRendererReady()) {
          pendingModelUrl = url;
          return;
        }

        if (model) {
          try {
            model.removeAllListeners();
            app.stage.removeChild(model);
            model.destroy();
          } catch (_) {
            // ignore cleanup errors
          }
          model = null;
        }

        model = await window.PIXI.live2d.Live2DModel.from(url);
        app.stage.addChild(model);

        bindModelInteraction();

        if (!Number.isFinite(state.scale) || state.scale <= 0) {
          const fitScaleX = (app.renderer.width * 0.65) / Math.max(1, model.width);
          const fitScaleY = (app.renderer.height * 0.92) / Math.max(1, model.height);
          state.scale = clamp(Math.min(fitScaleX, fitScaleY), MIN_SCALE, MAX_SCALE);
        }
        // Avoid invisible placement caused by oversized historic config values.
        if (model.width > app.renderer.width * 2 || model.height > app.renderer.height * 2) {
          const fitScaleX = (app.renderer.width * 0.65) / Math.max(1, model.width);
          const fitScaleY = (app.renderer.height * 0.92) / Math.max(1, model.height);
          state.scale = clamp(state.scale * Math.min(fitScaleX, fitScaleY), MIN_SCALE, MAX_SCALE);
        }

        applyModelTransform();
        notifyStateNow();
      }

      async function applyConfig(config) {
        const incoming = config || {};

        if (incoming.pet && typeof incoming.pet === "object") {
          Object.assign(state, incoming.pet);
        } else {
          Object.assign(state, incoming);
        }
        if (incoming.chat && typeof incoming.chat === "object") {
          Object.assign(state.chat, incoming.chat);
        }
        syncPetDisplayName();

        const nextModelUrl = incoming.model_url || incoming.modelUrl || state.model_url;
        if (typeof nextModelUrl === "string" && nextModelUrl.length > 0) {
          const changed = nextModelUrl !== state.model_url;
          state.model_url = nextModelUrl;
          if (changed || !model) {
            try {
              await loadModel(state.model_url);
            } catch (err) {
              showError(`load model failed: ${err?.message || String(err)}`);
            }
          } else {
            applyModelTransform();
          }
        } else {
          applyModelTransform();
        }

        refreshStatus();
      }

      async function init() {
        if (!window.PIXI) {
          showError("PIXI failed to load.");
          return;
        }

        app = new window.PIXI.Application({
          view: canvas,
          resizeTo: window,
          autoStart: true,
          backgroundAlpha: 0,
          antialias: true,
        });

        setupStageInteraction();

        app.ticker.add(() => {
          if (!model || !state.follow_mouse) {
            return;
          }

          const interaction = app.renderer?.plugins?.interaction;
          const mouse = interaction?.mouse?.global;
          if (!mouse || typeof model.focus !== "function") {
            return;
          }
          model.focus(mouse.x, mouse.y);
        });

        if (window.qt && window.QWebChannel) {
          new window.QWebChannel(window.qt.webChannelTransport, (channel) => {
            qtBridge = channel.objects.qtBridge;
            logToQt("QWebChannel ready");
          });
        }

        chatToggleEl.addEventListener("click", () => {
          if (chatPanelEl.classList.contains("open")) {
            closeChat();
          } else {
            openChat();
          }
        });
        chatCloseEl.addEventListener("click", () => closeChat());
        chatSendEl.addEventListener("click", async () => {
          if (chatState !== "idle") {
            return;
          }
          const text = chatInputEl.value;
          chatInputEl.value = "";
          await streamChat(text);
        });
        chatInputEl.addEventListener("keydown", async (event) => {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            if (chatState !== "idle") {
              return;
            }
            const text = chatInputEl.value;
            chatInputEl.value = "";
            await streamChat(text);
          }
        });
        chatStopEl.addEventListener("click", () => stopSpeaking(true));

        chatHeaderEl.addEventListener("pointerdown", (event) => {
          if (event.target === chatCloseEl) {
            return;
          }
          chatDragging = true;
          dragStartX = event.clientX;
          dragStartY = event.clientY;
          panelStartLeft = chatPanelEl.offsetLeft;
          panelStartTop = chatPanelEl.offsetTop;
          chatHeaderEl.setPointerCapture(event.pointerId);
          event.preventDefault();
        });

        const beginResize = (event, mode) => {
          chatResizing = true;
          chatResizeMode = mode;
          dragStartX = event.clientX;
          dragStartY = event.clientY;
          panelStartW = chatPanelEl.offsetWidth;
          panelStartH = chatPanelEl.offsetHeight;
          panelStartLeft = chatPanelEl.offsetLeft;
          panelStartTop = chatPanelEl.offsetTop;
          event.target.setPointerCapture(event.pointerId);
          event.preventDefault();
        };

        chatResizerRightEl.addEventListener("pointerdown", (event) => beginResize(event, "right"));
        chatResizerBottomEl.addEventListener("pointerdown", (event) => beginResize(event, "bottom"));
        chatResizerCornerEl.addEventListener("pointerdown", (event) => beginResize(event, "corner"));

        window.addEventListener("pointermove", (event) => {
          if (chatDragging) {
            const dx = event.clientX - dragStartX;
            const dy = event.clientY - dragStartY;
            const left = Math.min(
              Math.max(panelStartLeft + dx, 0),
              Math.max(0, window.innerWidth - chatPanelEl.offsetWidth),
            );
            const top = Math.min(
              Math.max(panelStartTop + dy, 0),
              Math.max(0, window.innerHeight - chatPanelEl.offsetHeight),
            );
            chatPanelEl.style.left = `${left}px`;
            chatPanelEl.style.top = `${top}px`;
          } else if (chatResizing) {
            const dx = event.clientX - dragStartX;
            const dy = event.clientY - dragStartY;
            const baseLeft = panelStartLeft;
            const baseTop = panelStartTop;
            let w = panelStartW;
            let h = panelStartH;
            if (chatResizeMode === "right" || chatResizeMode === "corner") {
              w = Math.min(Math.max(panelStartW + dx, 300), Math.max(300, window.innerWidth - baseLeft));
            }
            if (chatResizeMode === "bottom" || chatResizeMode === "corner") {
              h = Math.min(Math.max(panelStartH + dy, 280), Math.max(280, window.innerHeight - baseTop));
            }
            chatPanelEl.style.width = `${w}px`;
            chatPanelEl.style.height = `${h}px`;
          }
        });

        window.addEventListener("pointerup", () => {
          if (chatDragging || chatResizing) {
            saveChatPanelState();
          }
          chatDragging = false;
          chatResizing = false;
          chatResizeMode = "";
        });

        if (pendingConfig) {
          const cfg = pendingConfig;
          pendingConfig = null;
          await applyConfig(cfg);
        } else if (pendingModelUrl) {
          const url = pendingModelUrl;
          pendingModelUrl = "";
          await loadModel(url);
        }

        syncPetDisplayName();
        refreshStatus();
      }

      window.PET_APP = {
        async applyConfig(config) {
          if (!isRendererReady()) {
            pendingConfig = config || {};
            return;
          }
          await applyConfig(config);
        },
        async reloadModel() {
          if (state.model_url) {
            try {
              await loadModel(state.model_url);
            } catch (err) {
              showError(`reload model failed: ${err?.message || String(err)}`);
            }
          }
        },
        playMotion(group, index = 0) {
          if (!playMotionCompat(group, index)) {
            showError(`motion error: unable to play ${String(group)}[${Number(index) || 0}]`);
          }
        },
        playExpression(name) {
          if (!model || typeof model.expression !== "function") {
            return;
          }
          try {
            model.expression(name);
          } catch (err) {
            showError(`expression error: ${String(err)}`);
          }
        },
        getState() {
          return { ...state };
        },
        openChat,
        closeChat,
        async sendChat(text) {
          await streamChat(text || "");
        },
        async speakText(text) {
          const content = (text || "").trim();
          if (!content) return;
          stopSpeaking(false);
          streamFinished = true;
          pendingSpeakBuffer = "";
          ttsQueue = [];
          ttsPlaying = false;
          enqueueTTSChunk(content, null);
        },
        stopSpeak() {
          stopSpeaking(true);
        },
      };

      init().catch((err) => {
        showError(err?.message || String(err));
      });
    })();
  </script>
</body>
</html>
