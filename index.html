<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live2D 桌宠助手</title>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="./js/live2dcubismcore.min.js"></script>
  <script src="./js/live2d.min.js"></script>
  <script src="./js/pixi.min.js"></script>
  <script src="./js/index.min.js"></script>
  <script>
    (() => {
      const platform = String(navigator.userAgentData?.platform || navigator.platform || "").toLowerCase();
      if (platform.includes("mac")) {
        document.documentElement.classList.add("platform-macos");
      }
    })();
  </script>

  <style>
    :root {
      --shell-border: rgba(255, 255, 255, 0.68);
      --shell-shadow: 0 28px 58px rgba(121, 108, 177, 0.22);
      --shell-surface: rgba(255, 251, 255, 0.76);
      --shell-surface-strong: rgba(255, 255, 255, 0.88);
      --shell-pink: #f7a2c2;
      --shell-pink-strong: #ea88ae;
      --shell-blue: #8dc2ff;
      --shell-blue-strong: #6e9df3;
      --shell-ink: #5562a5;
      --window-inset: 12px;
      --window-radius: 30px;
      --chrome-height: 40px;
      --sidebar-width: 148px;
      --sidebar-width-current: 148px;
      --sidebar-width-compact: 112px;
      --shell-overlay: 0.42;
      --shell-sidebar-bg: linear-gradient(180deg, rgba(255, 239, 245, 0.84), rgba(240, 233, 255, 0.78));
      --panel-bg: linear-gradient(180deg, #f7fafd, #edf2f7);
      --panel-border: rgba(201, 213, 229, 0.95);
      --panel-text: #243447;
      --panel-muted: #637487;
      --panel-strong: #10243b;
      --accent: #5c8dff;
      --accent-soft: rgba(92, 141, 255, 0.16);
      --accent-strong: #3b6fe6;
      --success-soft: rgba(81, 184, 129, 0.18);
      --warning-soft: rgba(237, 170, 74, 0.2);
      --danger-soft: rgba(210, 72, 72, 0.22);
      --backdrop-overlay: 0.42;
      --stage-bg:
        radial-gradient(circle at 16% 18%, rgba(255, 211, 227, 0.78), transparent 28%),
        radial-gradient(circle at 84% 18%, rgba(198, 223, 255, 0.78), transparent 24%),
        radial-gradient(circle at 50% 82%, rgba(255, 255, 255, 0.58), transparent 18%),
        linear-gradient(180deg, #ffd9e8 0%, #f8dfef 34%, #dce8ff 100%);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--panel-text);
    }

    html.platform-macos {
      --window-inset: 0px;
      --window-radius: 0px;
      --chrome-height: 0px;
      --shell-shadow: none;
    }

    #window-background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background: var(--stage-bg);
      clip-path: inset(var(--window-inset) round var(--window-radius));
    }

    #window-background-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: none;
      filter: saturate(1.02) contrast(1.04);
    }

    #window-background.has-image #window-background-image {
      display: block;
    }

    #window-background-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 8%, rgba(255, 255, 255, 0.36), transparent 30%),
        linear-gradient(180deg, rgba(255, 255, 255, calc(var(--backdrop-overlay) * 0.24)), rgba(235, 240, 255, calc(var(--backdrop-overlay) * 0.2)));
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 12;
      clip-path: polygon(
        calc(var(--window-inset) + var(--sidebar-width-current)) calc(var(--window-inset) + var(--chrome-height)),
        calc(100% - var(--window-inset)) calc(var(--window-inset) + var(--chrome-height)),
        calc(100% - var(--window-inset)) calc(100% - var(--window-inset)),
        calc(var(--window-inset) + var(--sidebar-width-current)) calc(100% - var(--window-inset))
      );
    }

    #window-frame {
      position: fixed;
      inset: var(--window-inset);
      border: 1px solid var(--shell-border);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.78),
        0 0 0 1px rgba(141, 156, 209, 0.16);
      border-radius: var(--window-radius);
      pointer-events: none;
      display: block;
      z-index: 13;
    }

    html.platform-macos #window-frame {
      display: none;
    }

    #status {
      position: fixed;
      left: calc(var(--window-inset) + var(--sidebar-width-current) + 14px);
      top: 66px;
      z-index: 14;
      padding: 10px 12px;
      font-size: 11px;
      font-family: "Consolas", "Microsoft YaHei", sans-serif;
      color: var(--shell-ink);
      background: rgba(255, 255, 255, 0.74);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.44);
      box-shadow: 0 14px 28px rgba(119, 106, 175, 0.16);
      pointer-events: none;
      white-space: pre;
      min-width: 210px;
      display: none;
    }

    html.platform-macos #status {
      top: 18px;
    }

    #error {
      position: fixed;
      left: calc(var(--window-inset) + var(--sidebar-width-current) + 14px);
      bottom: 28px;
      z-index: 15;
      color: #8b365f;
      background: rgba(255, 245, 248, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 18px;
      box-shadow: 0 14px 28px rgba(119, 106, 175, 0.16);
      padding: 8px 12px;
      font-family: monospace;
      font-size: 12px;
      max-width: calc(100vw - 176px);
      display: none;
      pointer-events: none;
    }

    html.platform-macos #error {
      bottom: 18px;
    }

    #shell-app {
      position: fixed;
      inset: var(--window-inset);
      z-index: 8;
      display: grid;
      grid-template-columns: var(--sidebar-width-current) minmax(0, 1fr);
      grid-template-rows: var(--chrome-height) minmax(0, 1fr);
      overflow: hidden;
      border-radius: var(--window-radius);
      background: linear-gradient(
        135deg,
        rgba(255, 244, 248, calc(0.14 + var(--shell-overlay) * 0.34)),
        rgba(237, 243, 255, calc(0.12 + var(--shell-overlay) * 0.32))
      );
      box-shadow: var(--shell-shadow);
      pointer-events: none;
    }

    html.platform-macos #shell-app {
      background: linear-gradient(
        135deg,
        rgba(255, 244, 248, 0.18),
        rgba(237, 243, 255, 0.16)
      );
    }

    #shell-app::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1px solid rgba(255, 255, 255, 0.62);
      pointer-events: none;
    }

    html.platform-macos #shell-app::before {
      display: none;
    }

    #shell-app::after {
      content: "";
      position: absolute;
      inset: auto -6% -24% 38%;
      height: 58%;
      background:
        radial-gradient(circle at 18% 36%, rgba(255, 186, 213, 0.72), transparent 16%),
        radial-gradient(circle at 46% 34%, rgba(255, 255, 255, 0.76), transparent 15%),
        radial-gradient(circle at 72% 26%, rgba(196, 224, 255, 0.78), transparent 18%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(216, 231, 255, 0));
      border-radius: 999px;
      opacity: 0.88;
      pointer-events: none;
    }

    #shell-chrome {
      grid-column: 1 / -1;
      grid-row: 1;
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      height: var(--chrome-height);
      padding: 0 18px 0 16px;
      border-bottom: 1px solid rgba(210, 210, 242, 0.56);
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, calc(0.34 + var(--shell-overlay) * 0.3)),
        rgba(248, 244, 255, calc(0.26 + var(--shell-overlay) * 0.28))
      );
      pointer-events: auto;
    }

    html.platform-macos #shell-chrome {
      display: none;
    }

    #shell-chrome-lights {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chrome-light {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    .chrome-light:nth-child(1) {
      background: #f8aac5;
    }

    .chrome-light:nth-child(2) {
      background: #ffd8a5;
    }

    .chrome-light:nth-child(3) {
      background: #9ddbb9;
    }

    #shell-title-pill {
      justify-self: center;
      min-width: min(280px, 48vw);
      max-width: min(360px, 52vw);
      padding: 4px 24px;
      border-radius: 999px;
      background: rgba(241, 236, 252, 0.92);
      color: var(--shell-ink);
      font-family: "Segoe UI Variable Display", "Trebuchet MS", "Microsoft YaHei", sans-serif;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.02em;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    #shell-window-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-self: end;
      pointer-events: auto;
    }

    .window-action-button {
      width: 30px;
      height: 30px;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 18px rgba(123, 115, 182, 0.18);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      color: var(--shell-ink);
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    #window-close {
      color: #c06792;
    }

    #shell-sidebar {
      grid-column: 1;
      grid-row: 2;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 16px 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, calc(0.08 + var(--shell-overlay) * 0.16)), rgba(255, 255, 255, 0)),
        var(--shell-sidebar-bg);
      border-right: 1px solid rgba(245, 181, 207, 0.3);
      box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.44);
      overflow: hidden;
      pointer-events: auto;
    }

    html.platform-macos #shell-sidebar {
      padding-top: 22px;
    }

    #shell-sidebar::before,
    #shell-sidebar::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    #shell-sidebar::before {
      top: 20px;
      right: 12px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0)),
        radial-gradient(circle, rgba(248, 183, 213, 0.35), rgba(248, 183, 213, 0));
      opacity: 0.9;
    }

    #shell-sidebar::after {
      left: 14px;
      right: 14px;
      bottom: 22px;
      height: 72px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 22% 30%, rgba(255, 255, 255, 0.75), transparent 18%),
        radial-gradient(circle at 52% 55%, rgba(255, 195, 223, 0.56), transparent 16%),
        radial-gradient(circle at 78% 38%, rgba(205, 226, 255, 0.56), transparent 17%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0));
      opacity: 0.72;
    }

    .shell-nav-button {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      box-sizing: border-box;
      height: 52px;
      padding: 0 14px;
      border: none;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 24px rgba(137, 119, 185, 0.12);
      color: var(--shell-ink);
      font-family: "Segoe UI Variable Display", "Trebuchet MS", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease, color 0.16s ease;
      position: relative;
      z-index: 1;
    }

    .shell-nav-button svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex: 0 0 auto;
    }

    .shell-nav-button span {
      white-space: nowrap;
      line-height: 1;
    }

    .shell-nav-button.is-active {
      color: #fff9fd;
      background: linear-gradient(135deg, var(--shell-pink), var(--shell-blue));
      box-shadow: 0 18px 28px rgba(130, 123, 194, 0.28);
    }

    .shell-nav-button:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 10px 18px rgba(130, 123, 194, 0.12);
    }

    .shell-nav-button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      box-shadow: 0 10px 18px rgba(137, 119, 185, 0.08);
    }

    #shell-stage {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      overflow: hidden;
      pointer-events: none;
    }

    #shell-stage::before,
    #shell-stage::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
    }

    #shell-stage::before {
      inset: 12px 12% auto auto;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0));
    }

    #shell-stage::after {
      inset: auto auto -54px 18%;
      width: 360px;
      height: 180px;
      background:
        radial-gradient(circle at 20% 42%, rgba(255, 255, 255, 0.86), transparent 22%),
        radial-gradient(circle at 38% 56%, rgba(255, 215, 232, 0.8), transparent 18%),
        radial-gradient(circle at 62% 44%, rgba(214, 230, 255, 0.8), transparent 22%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0));
    }

    @media (max-width: 760px) {
      :root {
        --sidebar-width-current: var(--sidebar-width-compact);
      }

      #shell-app {
        grid-template-columns: var(--sidebar-width-current) minmax(0, 1fr);
      }

      #shell-title-pill {
        min-width: 0;
        max-width: min(220px, 40vw);
        padding-left: 16px;
        padding-right: 16px;
        font-size: 16px;
      }

      #shell-sidebar {
        padding-left: 12px;
        padding-right: 10px;
      }

      .shell-nav-button {
        gap: 10px;
        height: 48px;
        padding: 0 12px;
        font-size: 14px;
      }

      #status,
      #error {
        left: calc(var(--window-inset) + var(--sidebar-width-current) + 10px);
        max-width: calc(100vw - 136px);
      }
    }

    #chat-panel {
      position: fixed;
      left: 20px;
      top: 20px;
      width: min(420px, calc(100vw - 28px));
      height: min(620px, calc(100vh - 90px));
      z-index: 29;
      display: none;
      border-radius: 24px;
      background:
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.78), transparent 34%),
        linear-gradient(180deg, rgba(255, 248, 252, 0.98), rgba(252, 245, 248, 0.95));
      border: 1px solid rgba(255, 213, 229, 0.88);
      box-shadow:
        0 18px 42px rgba(126, 86, 106, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.82);
      overflow: hidden;
      color: #5c3f4a;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      min-width: 300px;
      min-height: 280px;
    }

    #chat-panel.open {
      display: grid;
      grid-template-rows: 54px auto 1fr auto;
    }

    #chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 700;
      color: #74475b;
      background: linear-gradient(180deg, rgba(255, 232, 242, 0.92), rgba(255, 244, 248, 0.9));
      border-bottom: 1px solid rgba(246, 203, 222, 0.9);
      cursor: move;
      user-select: none;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    #chat-skills-toggle,
    #chat-close {
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: #8b4b67;
      cursor: pointer;
      font-size: 16px;
    }

    #chat-skills-toggle {
      width: auto;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 700;
    }

    #chat-skills-toggle:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    #chat-mode-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(246, 203, 222, 0.78);
      background: linear-gradient(180deg, rgba(255, 245, 249, 0.96), rgba(255, 251, 252, 0.94));
    }

    .chat-mode-btn {
      border: none;
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 700;
      color: #7b5466;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 8px 16px rgba(123, 92, 108, 0.08);
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    .chat-mode-btn.is-active {
      color: #754258;
      background: linear-gradient(180deg, rgba(255, 224, 237, 0.98), rgba(249, 203, 223, 0.96));
      box-shadow: 0 10px 18px rgba(135, 90, 111, 0.14);
      transform: translateY(-1px);
    }

    #chat-skills-drawer {
      position: absolute;
      top: 102px;
      right: 12px;
      width: min(280px, calc(100% - 24px));
      max-height: min(420px, calc(100% - 186px));
      display: none;
      overflow: auto;
      z-index: 35;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 252, 253, 0.98), rgba(250, 243, 246, 0.96));
      border: 1px solid rgba(238, 203, 221, 0.98);
      box-shadow: 0 18px 36px rgba(109, 77, 92, 0.18);
      color: #654858;
    }

    #chat-skills-drawer.open {
      display: block;
    }

    #chat-history-drawer {
      position: absolute;
      top: 102px;
      left: 12px;
      width: min(300px, calc(100% - 24px));
      max-height: min(420px, calc(100% - 186px));
      display: none;
      overflow: auto;
      z-index: 35;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(252, 253, 255, 0.98), rgba(241, 245, 252, 0.96));
      border: 1px solid rgba(205, 217, 236, 0.98);
      box-shadow: 0 18px 36px rgba(77, 95, 124, 0.16);
      color: #4f5f79;
    }

    #chat-history-drawer.open {
      display: block;
    }

    .chat-history-head {
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(205, 217, 236, 0.9);
    }

    .chat-history-head strong {
      display: block;
      font-size: 13px;
      color: #425371;
    }

    .chat-history-head span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      line-height: 1.5;
      color: #6d7d97;
    }

    .chat-history-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 14px 10px;
      justify-content: flex-start;
    }

    #chat-history-status {
      padding: 0 14px 10px;
      font-size: 11px;
      line-height: 1.5;
      color: #6d7d97;
    }

    #chat-history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 14px 14px;
    }

    .chat-history-item {
      width: 100%;
      border: 1px solid rgba(212, 225, 241, 0.9);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      color: #4f5f79;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      box-shadow: 0 10px 20px rgba(92, 112, 141, 0.08);
    }

    .chat-history-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(92, 112, 141, 0.12);
    }

    .chat-history-item.is-active {
      border-color: rgba(92, 141, 255, 0.44);
      background: linear-gradient(180deg, rgba(241, 247, 255, 0.98), rgba(233, 242, 255, 0.94));
    }

    .chat-history-main {
      border: none;
      background: transparent;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      color: inherit;
      cursor: pointer;
    }

    .chat-history-delete {
      align-self: flex-end;
      border: none;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 700;
      color: #9c5163;
      background: rgba(255, 238, 242, 0.96);
      cursor: pointer;
      transition: background 0.16s ease, transform 0.16s ease;
    }

    .chat-history-delete:hover {
      background: rgba(255, 224, 231, 0.98);
      transform: translateY(-1px);
    }

    .chat-history-delete.is-danger {
      color: #fff6f7;
      background: linear-gradient(135deg, rgba(215, 97, 120, 0.98), rgba(184, 63, 94, 0.98));
      box-shadow: 0 10px 22px rgba(183, 78, 103, 0.24);
    }

    .chat-history-delete.is-danger:hover {
      background: linear-gradient(135deg, rgba(205, 82, 109, 0.99), rgba(169, 49, 82, 0.99));
    }

    .chat-history-item h4 {
      margin: 0;
      font-size: 13px;
      color: #3f4f6b;
    }

    .chat-history-item p {
      margin: 0;
      font-size: 11px;
      line-height: 1.5;
      color: #6d7d97;
    }

    .chat-history-meta {
      font-size: 11px;
      color: #8190a8;
    }

    .chat-skills-head {
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(238, 203, 221, 0.88);
    }

    .chat-skills-head strong {
