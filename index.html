<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live2D 桌宠助手</title>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="./js/live2dcubismcore.min.js"></script>
  <script src="./js/live2d.min.js"></script>
  <script src="./js/pixi.min.js"></script>
  <script src="./js/index.min.js"></script>
  <script>
    (() => {
      const platform = String(navigator.userAgentData?.platform || navigator.platform || "").toLowerCase();
      if (platform.includes("mac")) {
        document.documentElement.classList.add("platform-macos");
      }
    })();
  </script>

  <link rel="stylesheet" href="./frontend/index.css" />
</head>
<body>
  <div id="window-background">
    <img id="window-background-image" alt="" />
    <div id="window-background-overlay"></div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="shell-app">
    <div id="shell-chrome">
      <div id="shell-chrome-lights" aria-hidden="true">
        <span class="chrome-light"></span>
        <span class="chrome-light"></span>
        <span class="chrome-light"></span>
      </div>
      <div id="shell-title-pill">桌宠助手</div>
      <div id="shell-window-actions">
        <button id="window-minimize" class="window-action-button" type="button" aria-label="最小化窗口">-</button>
        <button id="window-close" class="window-action-button" type="button" aria-label="关闭窗口">x</button>
      </div>
    </div>
    <aside id="shell-sidebar" aria-label="桌宠快捷操作">
      <button id="nav-settings" class="shell-nav-button" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.14 12.94a7.48 7.48 0 0 0 .05-.94 7.48 7.48 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 1h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 7.48a.5.5 0 0 0 .12.64l2.03 1.58a7.48 7.48 0 0 0-.05.94c0 .32.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.4 1.05.72 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.8a.5.5 0 0 0 .49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64ZM12 15.25A3.25 3.25 0 1 1 12 8.75a3.25 3.25 0 0 1 0 6.5Z" />
        </svg>
        <span>设置</span>
      </button>
      <button id="nav-history" class="shell-nav-button" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.75a9.25 9.25 0 1 0 8.83 12h-1.62a7.75 7.75 0 1 1-1.78-8.07H15.5a.75.75 0 0 0 0 1.5H21a.75.75 0 0 0 .75-.75V2a.75.75 0 0 0-1.5 0v2.58A9.2 9.2 0 0 0 12 2.75Zm-.75 4.5a.75.75 0 0 1 1.5 0v4.19l2.96 1.7a.75.75 0 1 1-.74 1.3l-3.34-1.91a.75.75 0 0 1-.38-.65Z" />
        </svg>
        <span>历史</span>
      </button>
      <button id="nav-chat" class="shell-nav-button" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.25a.75.75 0 0 1 .75.75v7.25H20a.75.75 0 0 1 0 1.5h-7.25V20a.75.75 0 0 1-1.5 0v-7.25H4a.75.75 0 0 1 0-1.5h7.25V4a.75.75 0 0 1 .75-.75Z" />
        </svg>
        <span>新对话</span>
      </button>
    </aside>
    <div id="shell-stage" aria-hidden="true"></div>
    <div id="status">正在加载...</div>
    <div id="error"></div>
  </div>
  <div id="window-frame"></div>
  <div id="chat-panel">
    <div id="chat-header">
      <span id="chat-title">桌宠对话</span>
      <div class="chat-header-actions">
        <button id="chat-skills-toggle">技能</button>
        <button id="chat-close">×</button>
      </div>
    </div>
    <div id="chat-mode-bar">
      <button class="chat-mode-btn is-active" data-chat-mode="react">ReAct 模式</button>
      <button class="chat-mode-btn" data-chat-mode="chat">聊天模式</button>
      <button class="chat-mode-btn" data-chat-mode="skill">技能模式</button>
      <button class="chat-mode-btn is-active" data-memory-mode="persistent">保存</button>
      <button class="chat-mode-btn" data-memory-mode="temporary">临时</button>
    </div>
    <div id="chat-history-drawer">
      <div class="chat-history-head">
        <strong>话题历史</strong>
        <span id="chat-history-current">当前话题：未创建</span>
      </div>
      <div class="chat-history-actions">
        <button id="chat-history-refresh" class="chat-skill-action">刷新列表</button>
      </div>
      <div id="chat-history-status">正在加载话题列表...</div>
      <div id="chat-history-list"></div>
    </div>
    <div id="chat-skills-drawer">
      <div class="chat-skills-head">
        <strong>智能技能</strong>
        <span>这里管理当前聊天会话生效的技能，不会立即改写配置文件。</span>
      </div>
      <div class="chat-skills-actions">
        <button id="chat-skills-refresh" class="chat-skill-action">刷新技能</button>
        <button id="chat-skills-reset" class="chat-skill-action">恢复默认</button>
      </div>
      <div id="chat-skills-status">正在加载技能列表...</div>
      <div id="chat-skills-list"></div>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-wrap">
      <div id="chat-input-meta">
        <div id="chat-asr-status">&#25353;&#20303; Alt &#35828;&#35805;</div>
        <div id="chat-token-count" title="完成回复后显示模型提供方返回的实际 token 用量" aria-live="polite">Token --</div>
      </div>
      <textarea id="chat-input" placeholder="输入消息，Enter发送，Shift+Enter换行"></textarea>
      <button id="chat-send">发送</button>
      <button id="chat-stop">停止语音</button>
    </div>
    <div id="chat-resizer-right" class="chat-resizer-handle chat-resizer-right"></div>
    <div id="chat-resizer-bottom" class="chat-resizer-handle chat-resizer-bottom"></div>
    <div id="chat-resizer-corner" class="chat-resizer-handle chat-resizer-corner"></div>
  </div>

  <script src="./frontend/app_state.js"></script>
  <script src="./frontend/app_refs.js"></script>
  <script src="./frontend/index_helpers.js"></script>
  <script src="./frontend/shell_visuals.js"></script>
  <script src="./frontend/shell_bridge.js"></script>
  <script src="./frontend/human_ops_preview.js"></script>
  <script src="./frontend/chat_modes.js"></script>
  <script src="./frontend/chat_input_state.js"></script>
  <script src="./frontend/asr.js"></script>
  <script src="./frontend/chat_topic_history.js"></script>
  <script src="./frontend/chat_skills.js"></script>
  <script src="./frontend/chat_sidebars.js"></script>
  <script src="./frontend/speech.js"></script>
  <script src="./frontend/chat_worklog.js"></script>
  <script src="./frontend/chat_stream.js"></script>
  <script src="./frontend/chat_submit.js"></script>
  <script src="./frontend/chat_messages.js"></script>
  <script src="./frontend/proactive_presence.js"></script>
  <script src="./frontend/chat_panel.js"></script>
  <script src="./frontend/pet_scene.js"></script>
  <script src="./frontend/pet_state_notify.js"></script>
  <script src="./frontend/app_config.js"></script>
  <script src="./frontend/pet_app_api.js"></script>
  <script src="./frontend/app_bootstrap.js"></script>
  <script src="./frontend/controller_facade.js"></script>
  <script src="./frontend/controller_graph_chat_sections.js"></script>
  <script src="./frontend/controller_graph_app_sections.js"></script>
  <script src="./frontend/controller_graph_sections.js"></script>
  <script src="./frontend/controller_graph.js"></script>
  <script src="./frontend/index.js"></script>
</body>
</html>
